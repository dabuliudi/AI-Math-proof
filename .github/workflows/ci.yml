name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lean: ${{ steps.lean.outputs.lean }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 风险级别不在这里算：这个文件随 PR 一起改，PR 能改掉评判它自己的规则。见 risk-tier.yml。
      - name: Does the change touch the library or the checker
        id: lean
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          if git diff --name-only --no-renames "$(git merge-base "$BASE" HEAD)" HEAD \
              | grep -qE '^(lean/|forge/data/ledger\.jsonl|forge/(verify|leanrun|library|audit)\.py|\.github/workflows/)'; then
            echo lean=true >> "$GITHUB_OUTPUT"
          else
            echo lean=false >> "$GITHUB_OUTPUT"
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[pdf]'
      - name: forge tests
        run: python -m unittest discover -s forge/tests -t . -v
      - name: tests
        run: python -m unittest discover -s tests -v

  lean:
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # 库自己的编译结果（Mathlib2 分片、Forge 检查器）跨运行缓存：分片是追加式的，一次入库通常只改最后一个分片，
      # 不必每次从头编译全部分片（原来约 23 分钟）。Lake 按源码和依赖的哈希判断是否重编，缓存里过期的部分会自动重编，
      # 所以缓存只影响速度、不影响结果；审计（forge audit）照样对着编好的库逐条重新核对。
      # PR 只能读 main 写下的缓存、写自己分支的缓存，不能改 main 的缓存。
      - name: Restore the library build
        uses: actions/cache@v4
        with:
          path: lean/.lake/build
          key: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/*.lean', 'lean/lakefile.toml', 'lean/Mathlib2/**', 'lean/Research/**', 'lean/scripts/**') }}
          restore-keys: |
            lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Fetch Mathlib build cache
        working-directory: lean
        run: lake exe cache get
      - name: Build the admission checker
        working-directory: lean
        run: lake build Forge
      - name: Ledger and shards agree
        run: python -m forge consistency
      - name: Build the library and audit every theorem
        run: python -m forge audit

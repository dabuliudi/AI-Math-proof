_point gives a fixed point p, and bld3_edelstein_iterates_tendsto_uniformly gives N with dist (f^[n] x) p < ε/2 for all n ≥ N and x, so diam (range f^[n]) ≤ ε by Metric.diam_le_of_forall_dist_le.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld4_carleman_finite_three", "k": "proved", "d": "分析", "s": "(a : ℕ → ℝ) (ha : ∀ i : ℕ, 0 ≤ a i) (n : ℕ) : ∑ k ∈ Finset.range n, (∏ i ∈ Finset.range (k + 1), a i) ^ (1 / ((k : ℝ) + 1)) ≤ 3 * ∑ k ∈ Finset.range n, a k", "i": "Uses Mathlib2.an2_amgm_range_pow and Mathlib2.an2_succ_pow_lt_three_mul_pow (Carleman's inequality with constant 3 > e): with weights c_i = (i+2)^(i+1)/(i+1)^i (0-indexed) one has ∏_{i≤k} c_i = (k+2)^(k+1), so by an2_amgm_range_pow applied to a_i c_i, (∏_{i≤k} a_i)^(1/(k+1)) ≤ (∑_{i≤k} a_i c_i)/((k+1)(k+2)). Summing over k < n, swapping sums and telescoping ∑_{k≥i} 1/((k+1)(k+2)) ≤ 1/(i+1) gives ≤", "o": "conjecture", "c": 1, "r": ""}, {"n": "bld4_card_orderOf_eq_prime_of_card_prime_mul_prime", "k": "proved", "d": "组合与图论", "s": "(p q : ℕ) [Fact p.Prime] (hq : q.Prime) (hpq : p < q) (G : Type*) [Group G] (hG : Nat.card G = p * q) (hna : ∃ a b : G, a * b ≠ b * a) : Nat.card {g : G // orderOf g = p} = q * (p - 1)", "i": "Uses Mathlib2.bld3_card_sylow_of_card_prime_mul_prime: there are exactly q Sylow p-subgroups, each of order p; two distinct ones meet trivially, and every element of order p generates one. So the elements of order p are the disjoint union over the q Sylow p-subgroups of their p − 1 non-identity elements.", "o": "conjecture", "c": 1, "r": ""}, {"n": "poly_fermat_catalan_2_3_7", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [DecidableEq k] [CharZero k] (a b c : Polynomial k) (ha : a ≠ 0) (hb : b ≠ 0) (hc : c ≠ 0) (hab : IsCoprime a b) (hbc : IsCoprime b c) (hca : IsCoprime c a) (heq : a ^ 2 + b ^ 3 = c ^ 7) : a.natDegree = 0 ∧ b.natDegree = 0 ∧ c.natDegree = 0", "i": "In characteristic 0, a^2 + b^3 = c^7 has no non-constant pairwise coprime polynomial solutions (1/2+1/3+1/7 < 1) — Uses Mathlib2.ms_fermat_catalan with (p,q,r)=(2,3,7), u=v=1, w=-1; ringChar k = 0 divides none of 2,3,7; rewrite heq as C 1 * a^2 + C 1 * b^3 + C (-1) * c^7 = 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_fermat_quartic_4_4_2", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [DecidableEq k] [CharZero k] (a b c : Polynomial k) (ha : a ≠ 0) (hb : b ≠ 0) (hc : c ≠ 0) (hab : IsCoprime a b) (hbc : IsCoprime b c) (hca : IsCoprime c a) (heq : a ^ 4 + b ^ 4 = c ^ 2) : a.natDegree = 0 ∧ b.natDegree = 0 ∧ c.natDegree = 0", "i": "Polynomial analogue of Fermat's quartic theorem: a^4 + b^4 = c^2 forces coprime nonzero a, b, c to be constant in char 0 (borderline case 1/4+1/4+1/2 = 1) — Uses Mathlib2.ms_fermat_catalan with (p,q,r)=(4,4,2), u=v=1, w=-1; the only work is the ringChar and the 1/p+1/q+1/r ≤ 1 side conditions.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_x2_x_1_dvd_trinomial", "k": "proved", "d": "多项式", "s": "(k m : ℕ) : (Polynomial.X ^ 2 + Polynomial.X + 1 : Polynomial ℤ) ∣ Polynomial.X ^ (3 * k + 2) + Polynomial.X ^ (3 * m + 1) + 1", "i": "X^2+X+1 divides X^(3k+2) + X^(3m+1) + 1 over ℤ — X^3 ≡ 1 mod X^2+X+1 (since X^3 - 1 = (X-1)(X^2+X+1)), so the trinomial is ≡ X^2 + X + 1 ≡ 0.", "o": "conjecture", "c": 1, "r": ""}, {"n": "poly_int_odd_at_zero_one_no_root", "k": "proved", "d": "多项式", "s": "(p : Polynomial ℤ) (h0 : Odd (Polynomial.eval 0 p)) (h1 : Odd (Polynomial.eval 1 p)) (n : ℤ) : Polynomial.eval n p ≠ 0", "i": "An integer polynomial with p(0) and p(1) odd has no integer root — n - 0 ∣ p(n) - p(0) and n - 1 ∣ p(n) - p(1) (Polynomial.sub_dvd_eval_sub); if p(n) = 0 then both n and n-1 divide odd numbers, but one of them is even.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_int_three_ones_no_root", "k": "proved", "d": "多项式", "s": "(p : Polynomial ℤ) (a b c : ℤ) (hab : a ≠ b) (hbc : b ≠ c) (hac : a ≠ c) (ha : Polynomial.eval a p = 1) (hb : Polynomial.eval b p = 1) (hc : Polynomial.eval c p = 1) (r : ℤ) : Polynomial.eval r p ≠ 0", "i": "An integer polynomial taking the value 1 at three distinct integers has no integer root — if p(r) = 0 then r-a, r-b, r-c each divide p(r) - 1 = -1 (sub_dvd_eval_sub), so they are three distinct elements of {1,-1}, impossible.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_real_nonneg_coeff_no_pos_root", "k": "proved", "d": "多项式", "s": "(p : Polynomial ℝ) (hp : p ≠ 0) (h : ∀ i : ℕ, 0 ≤ p.coeff i) (x : ℝ) (hx : 0 < x) : Polynomial.eval x p ≠ 0", "i": "A nonzero real polynomial with nonnegative coefficients has no positive root (trivial case of Descartes' rule) — eval x p = Σ coeff i * x^i is a sum of nonnegative terms, at least one (the leading one) strictly positive.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_sophie_germain_not_irreducible", "k": "proved", "d": "多项式", "s": "(a : ℤ) : ¬ Irreducible (Polynomial.X ^ 4 + Polynomial.C (4 * a ^ 4) : Polynomial ℤ)", "i": "Sophie Germain: X^4 + 4a^4 is reducible over ℤ for every integer a — X^4 + 4a^4 = (X^2 + 2aX + 2a^2)(X^2 - 2aX + 2a^2), both monic of degree 2 hence non-units.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_abc_radical_bound_of_coprime", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [DecidableEq k] [CharZero k] (a b : Polynomial k) (hab : IsCoprime a b) (ha : 0 < a.natDegree) : max a.natDegree b.natDegree + 1 ≤ (UniqueFactorizationMonoid.radical (a * b * (a + b))).natDegree", "i": "ABC for polynomials in two-variable form: coprime a, b in char 0 with a non-constant satisfy max(deg a, deg b) + 1 ≤ deg rad(ab(a+b)) — b ≠ 0 and a+b ≠ 0 follow from coprimality and deg a > 0; Uses Mathlib2.ms_mason_stothers_v2 with c = -(a+b) (derivative a ≠ 0 in char 0 kills the first alternative), and radical(a*b*(-(a+b))) = radical(a*b*(a+b)) by associatedness.", "o": "conjecture", "c": 3, "r": ""}, {"n": "poly_catalan_pow_add_one", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [DecidableEq k] [CharZero k] (m n : ℕ) (hm : 2 ≤ m) (hn : 2 ≤ n) (g h : Polynomial k) (heq : g ^ m + 1 = h ^ n) : g.natDegree = 0 ∧ h.natDegree = 0", "i": "Catalan for polynomials: in char 0 two perfect powers g^m, h^n (m,n ≥ 2) differing by 1 are constants — Uses Mathlib2.ms_mason_stothers_v2 with a = g^m, b = 1, c = -h^n (pairwise coprime since g^m and h^n differ by a unit): if g is non-constant, D = m·deg g = n·deg h < deg rad(g^m h^n) ≤ deg g + deg h = D/m + D/n ≤ D, contradiction; g = 0 or g constant handled separately.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_chebyshev_T_abs_le_one", "k": "proved", "d": "多项式", "s": "(n : ℤ) (x : ℝ) (hx : |x| ≤ 1) : |Polynomial.eval x (Polynomial.Chebyshev.T ℝ n)| ≤ 1", "i": "Chebyshev polynomials of the first kind are bounded by 1 on [-1,1] — write x = cos θ with θ = arccos x, then T_n(cos θ) = cos(nθ) (Polynomial.Chebyshev.T_real_cos) and |cos| ≤ 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_x3_x_1_irreducible_rat", "k": "proved", "d": "多项式", "s": ": Irreducible (Polynomial.X ^ 3 + Polynomial.X + 1 : Polynomial ℚ)", "i": "X^3 + X + 1 is irreducible over ℚ — a cubic is irreducible iff it has no root; by the rational root theorem a rational root would be ±1, and neither is a root.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_flt_noncoprime_proportional", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [DecidableEq k] [CharZero k] (n : ℕ) (hn : 3 ≤ n) (a b c : Polynomial k) (ha : a ≠ 0) (hb : b ≠ 0) (hc : c ≠ 0) (heq : a ^ n + b ^ n = c ^ n) : ∃ (d : Polynomial k) (α β γ : k), a = Polynomial.C α * d ∧ b = Polynomial.C β * d ∧ c = Polynomial.C γ * d", "i": "FLT for polynomials without coprimality: in char 0, any nonzero solution of a^n + b^n = c^n (n ≥ 3) is a common polynomial d times a constant solution — take d = gcd(a,b); d^n ∣ c^n gives d ∣ c; the quotients are pairwise coprime and satisfy the same equation, so Uses Mathlib2.ms_flt_poly to make them constants.", "o": "conjecture", "c": 1, "r": ""}, {"n": "poly_cubic_real_roots_newton", "k": "proved", "d": "多项式", "s": "(a b c : ℝ) (h : (Polynomial.X ^ 3 + Polynomial.C a * Polynomial.X ^ 2 + Polynomial.C b * Polynomial.X + Polynomial.C c : Polynomial ℝ).roots.card = 3) : 3 * b ≤ a ^ 2", "i": "Newton's inequality for a real cubic with three real roots (with multiplicity): X^3 + aX^2 + bX + c splitting over ℝ forces a^2 ≥ 3b — the polynomial equals (X-r)(X-s)(X-t), so a = -(r+s+t), b = rs+st+tr and a^2 - 3b = ((r-s)^2 + (s-t)^2 + (t-r)^2)/2 ≥ 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_ratfunc_fermat_curve_const", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [DecidableEq k] [CharZero k] (n : ℕ) (hn : 3 ≤ n) (f g : RatFunc k) (heq : f ^ n + g ^ n = 1) : (∃ c : k, f = RatFunc.C c) ∧ (∃ d : k, g = RatFunc.C d)", "i": "The Fermat curve x^n + y^n = 1 (n ≥ 3) has no non-constant rational parametrisation in char 0 — write f = a/c, g = b/c with common denominator, cancel gcd(a,b,c) to get pairwise coprime a^n + b^n = c^n, then Uses Mathlib2.ms_flt_poly to conclude a, b, c constant; the cases a = 0 or b = 0 (g^n = 1 forces g constant) are separate.", "o": "conjecture", "c": 1, "r": ""}, {"n": "poly_davenport_sharp_deg_two", "k": "proved", "d": "多项式", "s": ": IsLeast {d : ℕ | ∃ f g : Polynomial ℚ, f.natDegree = 2 ∧ g.natDegree = 3 ∧ f ^ 3 ≠ g ^ 2 ∧ (f ^ 3 - g ^ 2).natDegree = d} 2", "i": "Davenport's bound is sharp in degree (2,3): the least possible degree of f^3 - g^2 ≠ 0 with deg f = 2, deg g = 3 over ℚ is exactly 2 — membership by f = X^2 + 2, g = X^3 + 3X (f^3 - g^2 = 3X^2 + 8); lower bound Uses Mathlib2.ms_davenport: f.natDegree + 2 = 4 ≤ 2·d.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_x4_x_1_irreducible_zmod2", "k": "proved", "d": "多项式", "s": ": Irreducible (Polynomial.X ^ 4 + Polynomial.X + 1 : Polynomial (ZMod 2))", "i": "X^4 + X + 1 is irreducible over F_2 — no roots in F_2, and the only irreducible quadratic is X^2+X+1 whose square is X^4+X^2+1 ≠ X^4+X+1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_x4_sub_10x2_add_1_irreducible_int", "k": "proved", "d": "多项式", "s": ": Irreducible (Polynomial.X ^ 4 - 10 * Polynomial.X ^ 2 + 1 : Polynomial ℤ)", "i": "The minimal polynomial X^4 - 10X^2 + 1 of √2+√3 is irreducible over ℤ — no integer roots (±1 fail); a factorisation into monic quadratics (X^2+aX+b)(X^2-aX+d) with bd = 1 forces a(d-b) = 0 and b+d-a^2 = -10, i.e. a^2 = 12 or a^2 = 8 or (a = 0, b + d = -10 with bd = 1), all impossible.", "o": "conjecture", "c": 1, "r": ""}, {"n": "poly_x4_sub_10x2_add_1_reducible_zmod", "k": "proved", "d": "多项式", "s": "(p : ℕ) [Fact p.Prime] : ¬ Irreducible (Polynomial.X ^ 4 - 10 * Polynomial.X ^ 2 + 1 : Polynomial (ZMod p))", "i": "X^4 - 10X^2 + 1 is reducible modulo every prime — one of 2, 3, 6 is a square mod p (Legendre symbol multiplicativity; p = 2, 3 by hand), and X^4-10X^2+1 = (X^2-1)^2 - 8X^2 = (X^2+1)^2 - 12X^2 = (X^2-5)^2 - 24, each a difference of squares when 2, 3, 6 respectively is a square.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_permMatrix_involution_rank_one_sub", "k": "proved", "d": "线性代数", "s": "(K : Type*) [Field K] [CharZero K] (ι : Type*) [Fintype ι] [DecidableEq ι] (σ : Equiv.Perm ι) (hσ : σ * σ = 1) : 2 * (1 - Equiv.Perm.permMatrix K σ).rank + (Finset.univ.filter (fun i => σ i = i)).card = Fintype.card ι", "i": "Uses Mathlib2.bld4_permMatrix_involution_rank_fixed_points and Mathlib2.bld_involution_rank_add_rank: P = permMatrix σ satisfies P*P = 1 (permMatrix is multiplicative up to order and σ*σ = 1), so bld_involution_rank_add_rank gives rank(1+P) + rank(1−P) = n, and bld4 gives 2·rank(1+P) = n + fix. Subtracting: 2·rank(1−P) = n − fix, i.e. rank(1 − P) is the number of 2-cycles of σ.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_trinomial_3k2_not_irreducible_int", "k": "proved", "d": "多项式", "s": "(k : ℕ) (hk : 1 ≤ k) : ¬ Irreducible (Polynomial.X ^ (3 * k + 2) + Polynomial.X + 1 : Polynomial ℤ)", "i": "X^n + X + 1 is reducible over ℤ for n ≡ 2 mod 3, n ≥ 5 (e.g. X^5+X+1 = (X^2+X+1)(X^3-X^2+1)) — X^2+X+1 divides it since X^3 ≡ 1; the monic cofactor has degree 3k ≥ 3 so neither factor is a unit.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_no_consecutive_powerful", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [DecidableEq k] [CharZero k] (f : Polynomial k) (hf : ∀ p : Polynomial k, Irreducible p → p ∣ f → p ^ 2 ∣ f) (hf1 : ∀ p : Polynomial k, Irreducible p → p ∣ f + 1 → p ^ 2 ∣ f + 1) : f.natDegree = 0", "i": "In char 0 there are no non-constant 'consecutive powerful polynomials': if every irreducible factor of f and of f+1 occurs at least squared then f is constant — a powerful polynomial g satisfies 2·deg rad g ≤ deg g; Uses Mathlib2.ms_mason_stothers_v2 with (f, 1, -(f+1)): deg f < deg rad(f(f+1)) = deg rad f + deg rad(f+1) ≤ deg f/2 + deg f/2, contradiction.", "o": "conjecture", "c": 1, "r": ""}, {"n": "bld5_gcd_fib_lucas_dvd_two", "k": "proved", "d": "数论", "s": "(n : ℕ) : Nat.gcd (Nat.fib n) (p3_lucas n) ∣ 2", "i": "Uses Mathlib2.bld2_lucas_sq_sub_five_fib_sq: with g = gcd(F_n, L_n), g² divides L_n² − 5F_n² = 4·(−1)^n (the bld2 identity, in ℤ), so g² ∣ 4 and hence g ∣ 2 (g ≤ 2 by size, then case check, or Nat.pow_dvd_pow_iff with 4 = 2²).", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_sqrt_two_rec_partial_sum_lower", "k": "proved", "d": "分析", "s": "(a : ℕ → ℝ) (h0 : a 0 = 0) (h : ∀ n : ℕ, a (n + 1) = Real.sqrt (2 + a n)) (n : ℕ) : 2 * (n : ℝ) - Real.pi ^ 2 / 3 ≤ ∑ i ∈ Finset.range n, a i", "i": "Uses Mathlib2.bld2_sqrt_two_rec_defect_summable, Mathlib2.bld3_sqrt_two_rec_defect_tsum_bounds and Mathlib2.ana_sqrt_two_rec_lt_two: ∑_{i<n} (2 − a_i) ≤ ∑' (2 − a_i) by sum_le_tsum (terms non-negative by ana_sqrt_two_rec_lt_two, summable by bld2), and the series is ≤ π²/3 by bld3; rearrange using Finset.sum_sub_distrib and Finset.sum_const.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_pell_five_neg_four_pisano_mod_eight", "k": "proved", "d": "数论", "s": "(x y : ℕ) (h : x ^ 2 + 4 = 5 * y ^ 2) (hy : 5 ≤ y) : p3_pisano y % 8 = 4", "i": "Uses Mathlib2.bld3_pell_five_neg_four_solutions_lucas and Mathlib2.bld2_pisano_fib_odd_eq: the Pell _le_tsum). Hardy's inequality bld2_hardy_inequality_tsum applied to the defect sequence bounds the left ", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_abc_distinct_roots_complex", "k": "proved", "d": "多项式", "s": "(a b : Polynomial ℂ) (hab : IsCoprime a b) (ha : 0 < a.natDegree) : a.natDegree + 1 ≤ (a * b * (a + b)).roots.toFinset.card", "i": "Stothers' form over ℂ: for coprime a, b with a non-constant, the product ab(a+b) has at least deg a + 1 distinct complex roots — Uses Mathlib2.ms_mason_stothers_v2 (c = -(a+b)) to get deg a < deg rad(ab(a+b)), then show over an algebraically closed field that natDegree (radical p) equals the number of distinct roots of p (radical is the product of the distinct monic linear factors).", "o": "conjecture", "c": 1, "r": ""}, {"n": "bld5_nonexpanding_denseRange_compact_recurrence", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] [CompactSpace X] (f : X → X) (hd : DenseRange f) (hf : ∀ x y : X, dist (f x) (f y) ≤ dist x y) (ε : ℝ) (hε : 0 < ε) : Isometry f ∧ ∃ n : ℕ, 0 < n ∧ ∀ x : X, dist (f^[n] x) x < ε", "i": "Uses Mathlib2.bld_surjective_nonexpanding_compact_isometry and Mathlib2.bld4_isometry_compact_uniform_recurrence: f is 1-Lipschitz hence continuous, so range f is compact, hence closed, and dense, hence everything (DenseRange.closure_range): f is surjective. bld_surjective_nonexpanding_compact_isometry makes f an isometry and bld4_isometry_compact_uniform_recurrence gives the uniform return time.", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_derivative_dvd_self_char_zero", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [CharZero k] (f : Polynomial k) (hf : 0 < f.natDegree) (h : Polynomial.derivative f ∣ f) : ∃ c a : k, f = Polynomial.C c * (Polynomial.X - Polynomial.C a) ^ f.natDegree", "i": "In char 0, a non-constant f with f' ∣ f is c·(X-a)^n — f = f'·q with q linear, q = (X-a)/n by comparing leading coefficients; then n·f = (X-a)f', and induction on n (or comparing root multiplicities at a: : first the duplication formula L_{2m} = L_m² − 2(−1)^m in ℤ (from lib_p3_lucas_cast, Nat.fib_two_mul, Nat.fib_two_mul_add_one, giving 2L_{2m} = L_m² + 5F_m², then the bld2 identity L_m² − 5F_m² = 4(−1)^m). With m = 2n: L_{4n} = L_{2n}² − 2, so p ∣ L_{4n} makes 2 a square in ZMod p, and ZMod.exists_sq_eq_two_iff (p ≠ 2) give", "o": "conjecture", "c": 1, "r": ""}, {"n": "bld5_commuting_idempotents_rank_sub_iff", "k": "proved", "d": "线性代数", "s": "(K : Type*) [Field K] [CharZero K] (ι : Type*) [Fintype ι] [DecidableEq ι] (A B : Matrix ι ι K) (hA : A * A = A) (hB : B * B = B) (hAB : A * B = B * A) : (A - B).rank + B.rank = A.rank ↔ A * B = B", "i": "Uses Mathlib2.bld3_commuting_idempotents_rank_sub, Mathlib2.bld_idempotent_sum_rank and Mathlib2.lib_matrix_rank_eq_zero_iff: bld3 gives rank(A−B) + 2·rank(AB) = rank A + rank B, so the left side is equivalent to rank(AB) = rank B. AB and B − AB are idempotents (commutativity) with idempotent sum B, so bld_idempotent_sum_rank gives rank B = rank(AB) + rank(B − AB). Hence rank(AB) = rank B ↔ rank(B", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_isometries_compact_simultaneous_recurrence", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] [CompactSpace X] {Y : Type*} [MetricSpace Y] [CompactSpace Y] (f : X → X) (g : Y → Y) (hf : Isometry f) (hg : Isometry g) (ε : ℝ) (hε : 0 < ε) : ∃ n : ℕ, 0 < n ∧ (∀ x : X, dist (f^[n] x) x < ε) ∧ ∀ y : Y, dist (g^[n] y) y < ε", "i": "Uses Mathlib2.bld4_isometry_compact_uniform_recurrence: apply it to Prod.map f g on the compact metric space X × Y (sup metric; Prod.map of isometries is an isometry, and (Prod.map f g)^[n] = Prod.map f^[n] g^[n]) to get n > 0 with dist((f^[n] x, g^[n] y), (x, y)) < ε for all (x, y); Prod.dist_eq (max) splits it into the two components. If X or Y is empty apply the theorem to the other factor alon", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_isometry_compact_id_uniform_limit", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] [CompactSpace X] (f : X → X) (hf : Isometry f) : ∃ φ : ℕ → ℕ, StrictMono φ ∧ TendstoUniformly (fun k x => f^[φ k] x) id Filter.atTop", "i": "Uses Mathlib2.bld4_isometry_compact_uniform_recurrence: first upgrade to arbitrarily large return times: for ε > 0 and N ≥ 1, the bld4 theorem with ε/N gives n > 0 with dist(f^[n] x, x) < ε/N for all x; since f^[n] is an isometry, the triangle inequality gives dist(f^[nN] x, x) ≤ N·sup dist(f^[n] y, y) < ε with nN ≥ N. Then build φ recursively (φ(k+1) > φ(k) with sup-distance < 1/(k+2)) and unfold", "o": "conjecture", "c": 0, "r": ""}, {"n": "poly_chebyshev_T_card_distinct_real_roots", "k": "proved", "d": "多项式", "s": "(n : ℕ) : (Polynomial.Chebyshev.T ℝ (n : ℤ)).roots.toFinset.card = n", "i": "T_n has exactly n distinct real roots — the n points cos((2k+1)π/(2n)), k < n, are distinct (cos is injective on [0,π]) roots since T_n(cos θ) = cos(nθ); and T_n has degree n so at most n roots.", "o": "conjecture", "c": 3, "r": ""}, {"n": "bld5_quadratic_annihilated_iff_rank_add_rank", "k": "proved", "d": "线性代数", "s": "(K : Type*) [Field K] (ι : Type*) [Fintype ι] [DecidableEq ι] (A : Matrix ι ι K) (a b : K) (hab : a ≠ b) : (A - a • (1 : Matrix ι ι K)) * (A - b • (1 : Matrix ι ι K)) = 0 ↔ (A - a • (1 : Matrix ι ι K)).rank + (A - b • (1 : Matrix ι ι K)).rank = Fintype.card ι", "i": "Uses Mathlib2.bld2_idempotent_iff_rank_add_rank and Mathlib2.lib_matrix_rank_smul: put P = (b − a)⁻¹ • (A − a•1), so 1 − P = −(b − a)⁻¹ • (A − b•1). A direct computation gives P*P − P = (b − a)⁻² • (A − a•1)(A − b•1), so the left side is equivalent to P*P = P, which by bld2_idempotent_iff_rank_add_rank is rank P + rank(1 − P) = card ι; lib_matrix_rank_smul (non-zero scalars (b−a)⁻¹ and −(b−a)⁻¹) r", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_fib_entry_point_pisano_ratio", "k": "proved", "d": "数论", "s": "(m : ℕ) (hm : 0 < m) : ∃ a : ℕ, 0 < a ∧ (∀ k : ℕ, m ∣ Nat.fib k ↔ a ∣ k) ∧ (p3_pisano m = a ∨ p3_pisano m = 2 * a ∨ p3_pisano m = 4 * a)", "i": "Uses Mathlib2.bld3_pisano_pos_and_period, Mathlib2.bld3_pisano_dvd_pisano_of_dvd and Mathlib2.bld2_pisano_fib_dvd_four_mul: bld3_pisano_pos_and_period at i = 0 gives m ∣ F_π with π = pisano m > 0, so a := Nat.find of {k > 0 | m ∣ F_k} exists (rank of apparition). m ∣ F_k ↔ a ∣ k: (⇐) Nat.fib_dvd; (⇒) m ∣ gcd(F_k, F_a) = F_{gcd(k,a)} by Nat.fib_gcd and minimality forces gcd(k,a) = a. Hence a ∣ π. C", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_mantel_equality_connected", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (hG : G.CliqueFree 3) (he : 4 * G.edgeFinset.card = Fintype.card V ^ 2) (hn : 2 ≤ Fintype.card V) : G.Connected", "i": "Uses Mathlib2.bld4_mantel_equality_complete_bipartite: it gives s with 2|s| = n and Adj x y ↔ (x ∈ s ↔ y ∉ s). Since n ≥ 2, both s and its complement are non-empty; pick u ∈ s, w ∉ s. Any x ∈ s is adjacent to w and any x ∉ s is adjacent to u, and u ~ w, so every two vertices are joined by a walk of length ≤ 3 through u, w: G is preconnected and V is non-empty.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_pisano_lucas_odd_eq", "k": "proved", "d": "数论", "s": "(n : ℕ) (hn : 3 ≤ n) (ho : Odd n) : p3_pisano (p3_lucas n) = 2 * n", "i": "Uses Mathlib2.lib_fib_period_iff, Mathlib2.bld3_pisano_dvd_of_period, Mathlib2.lib_pisano_dvd_iff_period, Mathlib2.lib_fib_cassini_cast and Mathlib2.lib_p3_lucas_cast: F_{2n} = F_n·L_n ≡ 0 (Nat.fib_two_mul) and F_{2n+1} = F_{n+1}·L_n − (−1)^n ≡ 1 mod L_n for odd n (lib_p3_lucas_cast, Nat.fib_two_mul_add_one, lib_fib_cassini_cast); so lib_fib_period_iff + bld3_pisano_dvd_of_period give π ∣ 2n (impr", "o": "conjecture", "c": 3, "r": ""}, {"n": "poly_cyclotomic_two_mul_odd_comp_neg", "k": "proved", "d": "多项式", "s": "(n : ℕ) (hn : Odd n) (h1 : 1 < n) : Polynomial.cyclotomic (2 * n) ℤ = (Polynomial.cyclotomic n ℤ).comp (-Polynomial.X)", "i": "For odd n > 1, Φ_{2n}(X) = Φ_n(-X) — Polynomial.cyclotomic_mul_prime_of_not_dvd-type identity Φ_{2n}(X)·Φ  r_{n−1} ≥ 1, so d_{n−1} ≥ 1. bld2_ran", "o": "conjecture", "c": 1, "r": ""}, {"n": "poly_real_nonneg_eq_sum_two_squares", "k": "proved", "d": "多项式", "s": "(p : Polynomial ℝ) (h : ∀ x : ℝ, 0 ≤ Polynomial.eval x p) : ∃ f g : Polynomial ℝ, p = f ^ 2 + g ^ 2", "i": "A real polynomial that is nonnegative on ℝ is a sum of two squares of real polynomials — strong induction on degree: real roots have even multiplicity (factor out (X-r)^2), irreducible quadratic factors are (X-u)^2 + v^2, and sums of two squares are closed under multiplication (Brahmagupta identity).", "o": "conjecture", "c": 1, "r": ""}, {"n": "bld5_card_orderOf_eq_larger_prime_of_card_prime_mul_prime", "k": "proved", "d": "组合与图论", "s": "(p q : ℕ) [Fact p.Prime] (hq : q.Prime) (hpq : p < q) (G : Type*) [Group G] (hG : Nat.card G = p * q) (hna : ∃ a b : G, a * b ≠ b * a) : Nat.card {g : G // orderOf g = q} = q - 1", "i": "Uses Mathlib2.bld4_card_orderOf_eq_prime_of_card_prime_mul_prime: every element has order dividing pq, i.e. in {1, p, q, pq}; order pq is impossible since then G is cyclic (isCyclic_of_orderOf_eq_card) hence commutative. Partition G by order: pq = 1 + q(p−1) + #{order q}, where q(p−1) is the bld4 count of elements of order p; so #{order q} = pq − 1 − q(p−1) = q − 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld5_card_pow_prime_eq_one_of_card_prime_cube", "k": "proved", "d": "组合与图论", "s": "(p : ℕ) (hp : p.Prime) (G : Type*) [Group G] (hG : Nat.card G = p ^ 3) (hna : ∃ a b : G, a * b ≠ b * a) (hp2 : p ≠ 2) : Nat.card {g : G // g ^ p = 1} = p ^ 2 ∨ Nat.card {g : G // g ^ p = 1} = p ^ 3", "i": "Uses Mathlib2.bld4_pow_prime_monoidHom_center_of_card_prime_cube and Mathlib2.bld_center_card_of_card_prime_cube: the bld4 theorem gives a homomorphism φ : G →* Z(G) with φ g = g^p, so {g | g^p = 1} is the carrier of φ.ker. By the first isomorphism theorem |G| = |ker φ|·|range φ|, and |range φ| divides |Z(G)| = p (bld_center_card_of_card_prime_cube, Lagrange), so |range φ| ∈ {1, p} and |ker φ| ∈ {",  rules out divisors of 3^n, and the exact valuation v_3(2^(3^(n-1)) + 1) = n (with 3 ∤ 2^(3^(n-1)) - 1) rules out 2·3^(n-1).", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_cos_le_quartic", "k": "proved", "d": "分析", "s": "(x : ℝ) : Real.cos x ≤ 1 - x ^ 2 / 2 + x ^ 4 / 24", "i": "cos x ≤ 1 − x²/2 + x⁴/24 for all real x — even function so WLOG x ≥ 0; derivative of RHS − LHS is sin x − x + x³/6 ≥ 0 (previous Taylor bound), value 0 at 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_tan_ge_cubic", "k": "proved", "d": "分析", "s": "(x : ℝ) (hx0 : 0 ≤ x) (hx : x < Real.pi / 2) : x + x ^ 3 / 3 ≤ Real.tan x", "i": "tan x ≥ x + x³/3 on [0, π/2) — derivative of tan x − x − x³/3 is tan²x − x² ≥ 0 since tan x ≥ x (Real.lt_tan); monotonicity on [0,π/2).", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_one_add_inv_pow_lt_exp", "k": "proved", "d": "分析", "s": "(n : ℕ) (hn : 0 < n) : (1 + 1 / (n : ℝ)) ^ n < Real.exp 1", "i": "(1+1/n)ⁿ < e — from 1 + t < exp t for t ≠ 0 (Real.add_one_lt_exp) at t = 1/n, raise to n-th power, exp(1/n)^n = e.", "o": "conjecture", "c": 2, "r": ""}, {"n": "calc_card_idempotent_functions", "k": "proved", "d": "线性代数", "s": "(n : ℕ) : ((Finset.univ : Finset (Fin n → Fin n)).filter (fun f => ∀ i, f (f i) = f i)).card = ∑ k ∈ Finset.range (n + 1), n.choose k * k ^ (n - k)", "i": "Number of idempotent self-maps of an n-set is ∑ₖ C(n,k) k^(n−k) — classify by the image S (= fixed-point set) of size k; the n−k other points map arbitrarily into S.", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_exp_lt_one_add_inv_pow_succ", "k": "proved", "d": "分析", "s": "(n : ℕ) (hn : 0 < n) : Real.exp 1 < (1 + 1 / (n : ℝ)) ^ (n + 1)", "i": "e < (1+1/n)^(n+1) — equivalent to 1/(n+1) < log(1+1/n), i.e. exp(−1/(n+1)) > 1 − 1/(n+1) = n/(n+1) (Real.add_one_lt_exp at t = −1/(n+1)); invert and raise to power n+1.", "o": "conjecture", "c": 1, "r": ""}, {"n": "calc_pi_rpow_exp_lt_exp_pi", "k": "proved", "d": "分析", "s": ": Real.pi ^ Real.exp 1 < Real.exp Real.pi", "i": "π^e < e^π — log x / x is strictly decreasing for x ≥ e, or directly log π < π/e from log t ≤ t − 1 with t = π/e ≠ 1 (Real.log_lt_sub_one_of_pos).", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_rpow_self_ge", "k": "proved", "d": "分析", "s": "(x : ℝ) (hx : 0 < x) : Real.exp (-Real.exp (-1)) ≤ x ^ x", "i": "xˣ ≥ e^(−1/e) for x > 0 — xˣ = exp(x log x) and x log x ≥ −1/e (apply log t ≤ t − 1 to t = 1/(e x), or Real.mul_log lower bound lemmas).", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_rpow_lt_rpow_swap_of_exp_le", "k": "proved", "d": "分析", "s": "(x y : ℝ) (hx : Real.exp 1 ≤ x) (hxy : x < y) : y ^ x < x ^ y", "i": "For e ≤ x < y, yˣ < xʸ — log t / t is strictly decreasing on [e, ∞) (derivative (1 − log t)/t² < 0 for t > e), so log y / y < log x / x; exponentiate.", "o": "conjecture", "c": 1, "r": ""}, {"n": "arith_centralBinom_dvd_lcm", "k": "proved", "d": "数论", "s": "(n : ℕ) : n.centralBinom ∣ (Finset.Icc 1 (2 * n)).lcm id", "i": "C(2n,n) divides lcm(1,…,2n) — for each prime p, v_p(C(2n,n)) ≤ log_p(2n) (Nat.factorization_choose_le_log) and p^⌊log_p 2n⌋ ≤ 2n lies in the range, so it divides the lcm; assemble via factorization.", "o": "conjecture", "c": 1, "r": ""}, {"n": "arith_sigma_le_mul_log", "k": "proved", "d": "数论", "s": "(n : ℕ) (hn : 0 < n) : ArithmeticFunction.sigma 1 n ≤ n * (Nat.log 2 n + 1)", "i": "σ(n) ≤ n(1 + ⌊log₂ n⌋) — σ(n) = Σ_{d|n} n/d ≤ Σ_{k ≤ n} ⌊n/k⌋·[k|n] ≤ n·H_n and H_n ≤ 1 + ⌊log₂ n⌋ by dyadic grouping.", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_tsum_inv_odd_sq", "k": "proved", "d": "分析", "s": ": ∑' n : ℕ, 1 / (2 * (n : ℝ) + 1) ^ 2 = Real.pi ^ 2 / 8", "i": "∑ 1/(2n+1)² = π²/8 — split Basel sum hasSum_zeta_two into even and odd indices (tsum_even_add_odd); even part is (1/4)·π²/6.", "o": "conjecture", "c": 3, "r": ""}, {"n": "arith_even_perfect_last_digit", "k": "proved", "d": "数论", "s": "(n : ℕ) (he : Even n) (hp : n.Perfect) : n % 10 = 6 ∨ n % 10 = 8", "i": "Every even perfect number ends in 6 or 8 — by Euclid–Euler (Mathlib) n = 2^k(2^(k+1)-1) with 2^(k+1)-1 prime; k+1 = 2 or odd; reduce 2^k mod 10 by k mod 4.", "o": "conjecture", "c": 1, "r": ""}, {"n": "arith_even_perfect_mod_nine", "k": "proved", "d": "数论", "s": "(n : ℕ) (he : Even n) (hp : n.Perfect) (h6 : n ≠ 6) : n % 9 = 1", "i": "Every even perfect number other than 6 is ≡ 1 (mod 9) — Euclid–Euler gives n = 2^(q-1)(2^q-1) with q an odd prime; 2 has order 6 mod 9 and q-1 is even, check the three residues of q-1 mod 6.", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_tendsto_sum_inv_add_log_two", "k": "proved", "d": "分析", "s": ": Filter.Tendsto (fun n : ℕ => ∑ k ∈ Finset.range n, 1 / ((n : ℝ) + (k : ℝ) + 1)) Filter.atTop (nhds (Real.log 2))", "i": "lim ∑_{k=1}^{n} 1/(n+k) = log 2 — squeeze: log((n+k+1)/(n+k)) ≤ 1/(n+k) … termwise bounds 1/(m+1) ≤ log(m+1) − log m ≤ 1/m telescope to log((2n+1)/(n+1)) ≤ S_n ≤ log 2; or via H_{2n} − H_n and Euler–Mascheroni asymptotics.", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_two_mul_dvd_totient_pow_add_one", "k": "proved", "d": "数论", "s": "(a n : ℕ) (ha : 1 < a) (hn : 0 < n) : 2 * n ∣ (a ^ n + 1).totient", "i": "2n divides φ(a^n + 1) for a > 1, n ≥ 1 — a is a unit mod N = a^n + 1 with a^n = -1 ≠ 1 and a^k < N - 1 for k < n, so its order is exactly 2n, and the order divides φ(N).", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_factorial_gt_div_exp_pow", "k": "proved", "d": "分析", "s": "(n : ℕ) (hn : 0 < n) : ((n : ℝ) / Real.exp 1) ^ n < (n.factorial : ℝ)", "i": "n! > (n/e)ⁿ for n ≥ 1 — eⁿ = ∑ nᵏ/k! > nⁿ/n! (a single term of the positive exponential series, Real.sum_le_exp_of_nonneg / strict since other terms are positive); or induction using (1+1/n)ⁿ < e.", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_tsum_alternating_inv_sq", "k": "proved", "d": "分析", "s": ": ∑' n : ℕ, (-1 : ℝ) ^ n / ((n : ℝ) + 1) ^ 2 = Real.pi ^ 2 / 12", "i": "∑ (−1)ⁿ/(n+1)² = π²/12 — equals (odd part) − (even part) of Basel sum = π²/8 − π²/24; uses hasSum_zeta_two and even/odd splitting.", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_mersenne_prime_factor", "k": "proved", "d": "数论", "s": "(p q : ℕ) (hp : p.Prime) (hp2 : p ≠ 2) (hq : q.Prime) (h : q ∣ 2 ^ p - 1) : q % (2 * p) = 1 ∧ (q % 8 = 1 ∨ q % 8 = 7)", "i": "Prime factors q of 2^p - 1 (p odd prime) satisfy q ≡ 1 mod 2p and q ≡ ±1 mod 8 — the order of 2 mod q is p so p | q-1, q odd gives 2p | q-1; 2 = (2^((p+1)/2))² mod q is a square, so q ≡ ±1 mod 8.", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_dvd_two_pow_add_one_three_dvd", "k": "proved", "d": "数论", "s": "(n : ℕ) (hn : 1 < n) (h : n ∣ 2 ^ n + 1) : 3 ∣ n", "i": "If n > 1 divides 2^n + 1 then 3 | n — let p be the least prime factor of n; the order of 2 mod p divides gcd(2n, p-1) = 2 (n is odd), so p | 2² - 1 = 3.", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_sigma_odd_iff", "k": "proved", "d": "数论", "s": "(n : ℕ) (hn : 0 < n) : Odd (ArithmeticFunction.sigma 1 n) ↔ IsSquare n ∨ ∃ m : ℕ, n = 2 * m ^ 2", "i": "σ(n) is odd iff n is a square or twice a square — σ multiplicative; σ(2^a) is always odd, σ(p^a) for odd p is odd iff a is even.", "o": "conjecture", "c": 2, "r": ""}, {"n": "arith_liouville_sum_card_divisors_cube", "k": "proved", "d": "数论", "s": "(n : ℕ) : ∑ d ∈ n.divisors, d.divisors.card ^ 3 = (∑ d ∈ n.divisors, d.divisors.card) ^ 2", "i": "Liouville's identity Σ_{d|n} τ(d)³ = (Σ_{d|n} τ(d))² — both sides are multiplicative in n; on p^a it is Σ_{j=1}^{a+1} j³ = (Σ j)² (Nicomachus).", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_perfect_not_isSquare", "k": "proved", "d": "数论", "s": "(n : ℕ) (hp : n.Perfect) : ¬ IsSquare n", "i": "No perfect number is a square — σ(m²) is odd (each σ(p^(2a)) is a sum of an odd number of odd terms, or p = 2) but σ(n) = 2n is even.", "o": "conjecture", "c": 1, "r": ""}, {"n": "arith_card_odd_choose", "k": "proved", "d": "数论", "s": "(n : ℕ) : ((Finset.range (n + 1)).filter (fun k => Odd (n.choose k))).card = 2 ^ (Nat.digits 2 n).sum", "i": "Glaisher: the number of odd entries in row n of Pascal's triangle is 2^(number of binary ones of n) — induct on binary digits using C(2n,2k) ≡ C(n,k), C(2n,2k+1) even, C(2n+1,2k) ≡ C(2n+1,2k+1) ≡ C(n,k) mod 2 (Lucas).", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_integral_beta_nat", "k": "proved", "d": "分析", "s": "(m n : ℕ) : ∫ x in (0:ℝ)..1, x ^ m * (1 - x) ^ n = ((m.factorial : ℝ) * n.factorial) / ((m + n + 1).factorial : ℝ)", "i": "Beta integral at naturals: ∫₀¹ xᵐ(1−x)ⁿ dx = m! n!/(m+n+1)! — induction on n with integration by parts B(m,n+1) = (n+1)/(m+1)·B(m+1,n); base ∫ xᵐ = 1/(m+1).", "o": "conjecture", "c": 4, "r": ""}, {"n": "arith_fermat_prime_factor_mod_two_pow_add_two", "k": "proved", "d": "数论", "s": "(n p : ℕ) (hn : 2 ≤ n) (hp : p.Prime) (h : p ∣ 2 ^ 2 ^ n + 1) : p % 2 ^ (n + 2) = 1", "i": "Lucas' strengthening: for n ≥ 2 every prime factor of the Fermat number F_n is ≡ 1 mod 2^(n+2) — Uses Mathlib2.nt2_fermat_number_prime_factor_form at step 1 to get p ≡ 1 mod 2^(n+1), hence p ≡ 1 mod 8, so 2 is a quadratic residue mod p (ZMod.exists_sq_eq_two_iff); a square root of 2 then has order 2^(n+2), which divides p - 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_totient_dvd_self_iff", "k": "proved", "d": "数论", "s": "(n : ℕ) (hn : 0 < n) : n.totient ∣ n ↔ n = 1 ∨ ∃ a b : ℕ, n = 2 ^ (a + 1) * 3 ^ b", "i": "φ(n) | n iff n = 1 or n = 2^a 3^b with a ≥ 1 — n/φ(n) = ∏ p/(p-1) must be an integer; for n>2 φ is even so 2 | n; the largest prime factor q>2 forces ∏(p-1) | ∏ p·…, compare 2-adic valuations: each odd prime contributes a factor 2 to φ, so at most one odd prime, and (q-1) | 2^a q forces q = 3.", "o": "conjecture", "c": 0, "r": ""}, {"n": "calc_tsum_millin", "k": "proved", "d": "分析", "s": ": ∑' n : ℕ, 1 / (Nat.fib (2 ^ n) : ℝ) = (7 - Real.sqrt 5) / 2", "i": "Millin series ∑_{n≥0} 1/F_{2ⁿ} = (7−√5)/2 — partial sums ∑_{n=0}^{N} 1/F_{2ⁿ} = 3 − F_{2^N − 1}/F_{2^N} for N ≥ 1 (induction, using F_{2m} = F_m L_m and d'Ocagne/Cassini), and F_{k−1}/F_k → 1/φ = (√5−1)/2.", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_odd_perfect_euler_form", "k": "proved", "d": "数论", "s": "(n : ℕ) (ho : Odd n) (hp : n.Perfect) : ∃ p a m : ℕ, p.Prime ∧ p % 4 = 1 ∧ a % 4 = 1 ∧ ¬ p ∣ m ∧ n = p ^ a * m ^ 2", "i": "Euler's theorem on odd perfect numbers: n = p^a m² with p ≡ a ≡ 1 (mod 4), p ∤ m — σ(n) = 2n ≡ 2 (mod 4), so exactly one factor σ(q^e) is even and it is ≡ 2 mod 4; σ(q^e) for odd q is odd iff e even, and ≡ 2 mod 4 forces q ≡ e ≡ 1 mod 4.", "o": "conjecture", "c": 1, "r": ""}, {"n": "arith_least_odd_abundant", "k": "proved", "d": "数论", "s": "(n : ℕ) (ho : Odd n) (ha : n.Abundant) : 945 ≤ n", "i": "945 is the least odd abundant number — for odd n < 945: n has at most 3 distinct prime factors unless n ≥ 3·5·7·11; bound σ(n)/n < ∏ p/(p-1) and handle the families 3^a5^b7^c < 945 (or a finite case check).", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_sum_lcm", "k": "proved", "d": "数论", "s": "(n : ℕ) (hn : 0 < n) : 2 * ∑ k ∈ Finset.Icc 1 n, Nat.lcm k n = n * (1 + ∑ d ∈ n.divisors, d * d.totient)", "i": "Σ_{k=1}^n lcm(k,n) = (n/2)(1 + Σ_{d|n} dφ(d)) — group k by g = gcd(k,n): lcm = n·(k/g) with k/g a totative of d = n/g; Uses Mathlib2.nt2_two_mul_sum_coprime_eq_mul_totient at the inner step for every d > 1 (twice the totative sum is dφ(d)); the d = 1 term contributes the extra 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "arith_odd_perfect_not_dvd_105", "k": "proved", "d": "数论", "s": "(n : ℕ) (ho : Odd n) (hp : n.Perfect) : ¬ 105 ∣ n", "i": "No odd perfect number is divisible by 105 — by Euler's form the exponents of 3 and 7 (≡ 3 mod 4) are even, so 3²·5·7² | n and σ(n)/n ≥ (13/9)(6/5)(57/49) > 2 (σ(n)/n is monotone under divisibility), contradiction.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_finite_field_sum_two_squares", "k": "proved", "d": "代数", "s": "(K : Type) [Field K] [Fintype K] (a : K) : ∃ x y : K, x ^ 2 + y ^ 2 = a", "i": "Every element of a finite field is a sum of two squares — in characteristic 2 every element is a square (FiniteField.isSquare_of_char_two); otherwise apply FiniteField.exists_root_sum_quadratic to X^2 and X^2 - a (card is odd), or pigeonhole on the (q+1)/2 squares.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_cyclotomic_coeff_symm", "k": "proved", "d": "多项式", "s": "(n k : ℕ) (hn : 2 ≤ n) (hk : k ≤ n.totient) : (Polynomial.cyclotomic n ℤ).coeff k = (Polynomial.cyclotomic n ℤ).coeff (n.totient - k)", "i": "Uses Mathlib2.poly_cyclotomic_reverse_eq_self: rewrite the left side with reverse Φ_n = Φ_n and apply Polynomial.coeff_reverse with natDegree Φ_n = φ(n) (Polynomial.natDegree_cyclotomic) and revAt φ(n) k = φ(n) - k for k ≤ φ(n).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_irrational_cbrt_two", "k": "proved", "d": "数论", "s": "(x : ℝ) (hx : x ^ 3 = 2) : Irrational x", "i": "The real cube root of 2 is irrational — Uses Mathlib2.alg_rat_pow_ne_two at the only step: if x = (q : ℝ) then q^3 = 2 in ℚ by Rat.cast injectivity, contradicting alg_rat_pow_ne_two 3.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_cyclotomic_eval_neg_one_of_odd", "k": "proved", "d": "多项式", "s": "(n : ℕ) (hn : Odd n) (h1 : 1 < n) : Polynomial.eval (-1) (Polynomial.cyclotomic n ℤ) = 1", "i": "Uses Mathlib2.poly_cyclotomic_two_mul_odd_comp_neg: Φ_n(-1) = (Φ_n ∘ (-X))(1) = Φ_(2n)(1) by the library identity (eval_comp); 2n with n odd > 1 is not a prime power, so Polynomial.eval_one_cyclotomic_not_prime_pow gives Φ_(2n)(1) = 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_prime_one_mod_three_eq_sq_add_three_sq", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (h : p % 3 = 1) : ∃ a b : ℕ, p = a ^ 2 + 3 * b ^ 2", "i": "Every prime p ≡ 1 (mod 3) is of the form a^2 + 3b^2 — -3 is a square mod p (cube roots of unity in F_p), so p | x^2 + 3 for some x; Thue's lemma / pigeonhole gives 0 < a^2 + 3b^2 ≡ 0 mod p with a, b < √p, hence a^2 + 3b^2 ∈ {p, 2p, 3p}; 2p is impossible mod 4 (or mod 3) and 3p reduces to p by a = 3a'.", "o": "conjecture", "c": 4, "r": ""}, {"n": "bld6_cyclotomic_two_mul_odd_coeff", "k": "proved", "d": "多项式", "s": "(n k : ℕ) (hn : Odd n) (h1 : 1 < n) : (Polynomial.cyclotomic (2 * n) ℤ).coeff k = (-1) ^ k * (Polynomial.cyclotomic n ℤ).coeff k", "i": "Uses Mathlib2.poly_cyclotomic_two_mul_odd_comp_neg: rewrite Φ_(2n) = Φ_n ∘ (-X) and compute the k-th coefficient of p.comp(-X) as (-1)^k p.coeff k (write -X = C(-1)·X and use the coefficient formula for comp with C a * X).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_sum_pow_finite_field", "k": "proved", "d": "代数", "s": "(K : Type) [Field K] [Fintype K] (k : ℕ) (hk : 0 < k) : ∑ x : K, x ^ k = if (Fintype.card K - 1) ∣ k then (-1 : K) else 0", "i": "Complete power-sum formula over a finite field F_q: for k > 0, the sum of x^k over all x is -1 if (q-1) | k and 0 otherwise — since k > 0 the term x = 0 contributes 0, so the sum equals the sum over units, which is FiniteField.sum_pow_units.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_nat_pow_lt_pow_swap", "k": "proved", "d": "数论", "s": "(m n : ℕ) (hm : 3 ≤ m) (hmn : m < n) : n ^ m < m ^ n", "i": "Uses Mathlib2.calc_rpow_lt_rpow_swap_of_exp_le: apply it with x = m, y = n; the hypothesis e ≤ m follows from Real.exp_one_lt_d9 (e < 3 ≤ m); then convert rpow with natural exponents to Nat powers (Real.rpow_natCast, Nat.cast_lt).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_prime_one_three_mod_eight_eq_sq_add_two_sq", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (h : p % 8 = 1 ∨ p % 8 = 3) : ∃ a b : ℕ, p = a ^ 2 + 2 * b ^ 2", "i": "Every prime p ≡ 1 or 3 (mod 8) is of the form a^2 + 2b^2 — -2 is a square mod p (ZMod.exists_sq_eq_neg_two_iff / FiniteField.isSquare_neg_two_iff), so p | x^2 + 2; Thue's lemma gives 0 < a^2 + 2b^2 < 3p divisible by p, so it is p or 2p; in the latter case a is even and p = b^2 + 2(a/2)^2. Alternatively use that Z[√-2] is Euclidean.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_succ_pow_lt_exp_pow_mul_factorial", "k": "proved", "d": "分析", "s": "(n : ℕ) (hn : 0 < n) : ((n : ℝ) + 1) ^ n < Real.exp 1 ^ n * n.factorial", "i": "Uses Mathlib2.calc_one_add_inv_pow_lt_exp: induction on n via (n+1)^n/n! = ∏_{k=1}^n (1+1/k)^k (ratio of consecutive terms is (1+1/(n+1))^(n+1)); each factor is < e by calc_one_add_inv_pow_lt_exp. Strengthens Mathlib2.calc_factorial_gt_div_exp_pow from n^n to (n+1)^n.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_prime_eq_sq_add_mul_add_sq_iff", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) : (∃ a b : ℕ, p = a ^ 2 + a * b + b ^ 2) ↔ p = 3 ∨ p % 3 = 1", "i": "A prime is represented by the Eisenstein norm form a^2 + ab + b^2 (a, b ≥ 0) iff p = 3 or p ≡ 1 (mod 3) — (→) a^2 + ab + b^2 mod 3 is never 2; (←) 3 = 1 + 1 + 1, and for p ≡ 1 mod 3 write p = c^2 + 3d^2 (the a^2 + 3b^2 theorem), then with c > d: a = c - d, b = 2d, and with c < d use the equivalent form (d - c, c + d) after symmetry, checking nonnegativity.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_factorial_lt_exp_mul_pow", "k": "proved", "d": "分析", "s": "(n : ℕ) (hn : 2 ≤ n) : (n.factorial : ℝ) < Real.exp 1 * n * ((n : ℝ) / Real.exp 1) ^ n", "i": "Uses Mathlib2.calc_exp_lt_one_add_inv_pow_succ: put a_n = n!·e^n/(n·n^n); a_1 = e and a_(n+1)/a_n = e/(1+1/n)^(n+1) < 1 by calc_exp_lt_one_add_inv_pow_succ (the induction step), so a_n < e for n ≥ 2. This is the upper companion of Mathlib2.calc_factorial_gt_div_exp_pow.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_card_hyperbola_zmod", "k": "proved", "d": "组合与图论", "s": "(p : ℕ) [Fact p.Prime] (hp : p ≠ 2) (a : ZMod p) (ha : a ≠ 0) : ((Finset.univ : Finset (ZMod p × ZMod p)).filter (fun v => v.1 ^ 2 - v.2 ^ 2 = a)).card = p - 1", "i": "For odd p and a ≠ 0 the equation x^2 - y^2 = a has exactly p-1 solutions in F_p — the change of variables u = x+y, v = x-y is a bijection of F_p^2 (2 invertible) turning it into uv = a, whose solutions are (u, a/u) for the p-1 units u.", "o": "conjecture", "c": 1, "r": ""}, {"n": "fld_isSquare_three_zmod_iff", "k": "proved", "d": "数论", "s": "(p : ℕ) [Fact p.Prime] (hp : 3 < p) : IsSquare (3 : ZMod p) ↔ p % 12 = 1 ∨ p % 12 = 11", "i": "3 is a quadratic residue mod a prime p > 3 iff p ≡ ±1 (mod 12) — quadratic reciprocity (ZMod.exists_sq_eq_prime_iff_of_mod_four_eq_one / _three) reduces to whether p is a square mod 3, i.e. p ≡ 1 mod 3, with a sign flip when p ≡ 3 mod 4; combine residues mod 4 and mod 3.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_pell_two_pm_one_solutions", "k": "proved", "d": "数论", "s": "(x y : ℤ) (hx : 0 < x) (hy : 0 ≤ y) (h : x ^ 2 - 2 * y ^ 2 = 1 ∨ x ^ 2 - 2 * y ^ 2 = -1) : ∃ n : ℕ, (⟨x, y⟩ : Zsqrtd 2) = (⟨1, 1⟩ : Zsqrtd 2) ^ n", "i": "Every solution of x^2 - 2y^2 = ±1 with x > 0, y ≥ 0 is a power of the fundamental unit: x + y√2 = (1 + √2)^n — strong induction on y: if y = 0 then x = 1, n = 0; otherwise multiply by (1+√2)^{-1} = -1 + √2 to get (x', y') = (2y - x, x - y), which is again a solution with x' > 0 and 0 ≤ y' < y (from y ≤ x < 2y for y ≥ 1, with the edge case (1,1)).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_irrational_logb_two_three", "k": "proved", "d": "分析", "s": ": Irrational (Real.logb 2 3)", "i": "log_2 3 is irrational — if log_2 3 = a/b with b > 0 then (a > 0 and) 2^a = 3^b in ℕ after clearing rpow, impossible by parity (2^a even, 3^b odd).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_isSquare_five_zmod_iff", "k": "proved", "d": "数论", "s": "(p : ℕ) [Fact p.Prime] (hp2 : p ≠ 2) (hp5 : p ≠ 5) : IsSquare (5 : ZMod p) ↔ p % 5 = 1 ∨ p % 5 = 4", "i": "5 is a quadratic residue mod a prime p ≠ 2, 5 iff p ≡ ±1 (mod 5) — since 5 ≡ 1 mod 4, ZMod.exists_sq_eq_prime_iff_of_mod_four_eq_one gives IsSquare (5 : ZMod p) ↔ IsSquare (p : ZMod 5), and the nonzero squares mod 5 are 1 and 4. (Makes the hypotheses of Mathlib2.bld4_pisano_prime_dvd_pred_of_isSquare_five checkable.)", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_zsqrtd_neg_five_two_irreducible_not_prime", "k": "proved", "d": "代数", "s": ": Irreducible (2 : Zsqrtd (-5)) ∧ ¬ Prime (2 : Zsqrtd (-5))", "i": "In ℤ[√-5] the element 2 is irreducible but not prime (the classical non-UFD example) — norm a^2 + 5b^2 never equals 2, so a factorization 2 = xy (norms multiply to 4) has a factor of norm 1, a unit; yet 2 | 6 = (1+√-5)(1-√-5) while 2 divides neither factor (compare coefficients).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_minpoly_sqrt_two", "k": "proved", "d": "多项式", "s": ": minpoly ℚ (Real.sqrt 2) = Polynomial.X ^ 2 - 2", "i": "The minimal polynomial of √2 over ℚ is X^2 - 2 — it is monic, annihilates √2, and is irreducible over ℚ (degree 2 without rational root since √2 is irrational); conclude with minpoly.eq_of_irreducible_of_monic.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_sum_quadraticChar_sq_add", "k": "proved", "d": "数论", "s": "(p : ℕ) [Fact p.Prime] (hp : p ≠ 2) (a : ZMod p) (ha : a ≠ 0) : ∑ x : ZMod p, quadraticChar (ZMod p) (x ^ 2 + a) = -1", "i": "Quadratic character sum Σ_x χ(x^2 + a) = -1 for a ≠ 0 in F_p, p odd — count solutions of y^2 = x^2 + a two ways: it equals Σ_x (1 + χ(x^2 + a)) by quadraticChar_card_sqrts and equals p - 1 by the hyperbola count (y-x)(y+x) = a.", "o": "conjecture", "c": 1, "r": ""}, {"n": "fld_minpoly_sqrt_two_add_sqrt_three", "k": "proved", "d": "多项式", "s": ": minpoly ℚ (Real.sqrt 2 + Real.sqrt 3) = Polynomial.X ^ 4 - 10 * Polynomial.X ^ 2 + 1", "i": "The minimal polynomial of √2 + √3 over ℚ is X^4 - 10X^2 + 1 — the polynomial is monic and vanishes at √2+√3 ((√2+√3)^2 = 5 + 2√6); Uses Mathlib2.poly_x4_sub_10x2_add_1_irreducible_int for irreducibility over ℤ, transferred to ℚ by Gauss's lemma (Polynomial.Monic.irreducible_iff_irreducible_map_fraction_map), then minpoly.eq_of_irreducible_of_monic.", "o": "conjecture", "c": 1, "r": ""}, {"n": "fld_card_image_sq_finite_field", "k": "proved", "d": "组合与图论", "s": "(K : Type) [Field K] [Fintype K] [DecidableEq K] (h : ringChar K ≠ 2) : (Finset.univ.image (fun x : K => x ^ 2)).card = (Fintype.card K + 1) / 2", "i": "A finite field of odd characteristic with q elements has exactly (q+1)/2 squares. Generalizes Mathlib2.alg_card_range_sq_zmod_prime from ZMod p to all finite fields — squaring is 2-to-1 on nonzero elements (x^2 = y^2 iff x = ±y, and x ≠ -x as char ≠ 2), plus 0; q is odd.", "o": "conjecture", "c": 1, "r": ""}, {"n": "bld6_hardy_odd_harmonic_means", "k": "proved", "d": "分析", "s": ": ∑' k : ℕ, ((∑ i ∈ Finset.range (k + 1), 1 / (2 * (i : ℝ) + 1)) / ((k : ℝ) + 1)) ^ 2 ≤ Real.pi ^ 2 / 2", "i": "Uses Mathlib2.bld2_hardy_inequality_tsum and Mathlib2.calc_tsum_inv_odd_sq: apply Hardy's inequality to a_k = 1/(2k+1); summability of a_k^2 and the value ∑ a_k^2 = π^2/8 come from calc_tsum_inv_odd_sq (rewrite (1/(2k+1))^2 = 1/(2k+1)^2), so the bound is 4·π^2/8.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_card_circle_zmod", "k": "proved", "d": "组合与图论", "s": "(p : ℕ) [Fact p.Prime] (hp : p ≠ 2) : ((Finset.univ : Finset (ZMod p × ZMod p)).filter (fun v => v.1 ^ 2 + v.2 ^ 2 = 1)).card = if p % 4 = 1 then p - 1 else p + 1", "i": "The circle x^2 + y^2 = 1 over F_p (p odd) has p - (-1/p) points: p-1 if p ≡ 1 mod 4 and p+1 if p ≡ 3 mod 4 — if -1 = i^2 the substitution u = x+iy, v = x-iy gives the hyperbola uv = 1 with p-1 points; otherwise count via N = Σ_x (1 + χ(1-x^2)) and the Jacobsthal sum Σ χ(x^2 - 1)·χ(-1) = -χ(-1), or parametrize rationally by lines through (1,0).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_mul_isSquare_of_not_isSquare", "k": "proved", "d": "数论", "s": "(K : Type) [Field K] [Fintype K] (a b : K) (ha : ¬ IsSquare a) (hb : ¬ IsSquare b) : IsSquare (a * b)", "i": "In a finite field the product of two non-squares is a square — in characteristic 2 everything is a square; otherwise the quadratic character is multiplicative with values ±1 on nonzero elements and equals -1 exactly on non-squares (quadraticChar_neg_one_iff_not_isSquare), so χ(ab) = 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_gaussianInt_prime_of_norm_prime", "k": "proved", "d": "代数", "s": "(z : GaussianInt) (h : Nat.Prime z.norm.natAbs) : Prime z", "i": "A Gaussian integer whose norm is a rational prime is a Gaussian prime — if z = xy then N(x)N(y) = p so one of x, y has norm 1 and is a unit (Zsqrtd.norm_eq_one_iff), so z is irreducible; ℤ[i] is a PID so irreducible elements are prime.", "o": "conjecture", "c": 1, "r": ""}, {"n": "fld_card_four_sq_add_self_add_one", "k": "proved", "d": "组合与图论", "s": "(K : Type) [Field K] [Fintype K] (h : Fintype.card K = 4) (x : K) (h0 : x ≠ 0) (h1 : x ≠ 1) : x ^ 2 + x + 1 = 0", "i": "In a field with 4 elements every element other than 0, 1 is a root of X^2 + X + 1 — x^3 = 1 by FiniteField.pow_card_sub_one_eq_one, so (x - 1)(x^2 + x + 1) = 0 and x ≠ 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_irreducible_X_sq_add_one_zmod_iff", "k": "proved", "d": "多项式", "s": "(p : ℕ) [Fact p.Prime] : Irreducible (Polynomial.X ^ 2 + 1 : Polynomial (ZMod p)) ↔ p % 4 = 3", "i": "X^2 + 1 is irreducible over F_p iff p ≡ 3 (mod 4) — a monic quadratic is irreducible iff it has no root (Polynomial.Monic.irreducible_iff_roots_eq_zero_of_degree_le_three), and a root is a square root of -1, which exists iff p % 4 ≠ 3 (ZMod.exists_sq_eq_neg_one_iff).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_gaussianInt_isUnit_iff", "k": "proved", "d": "代数", "s": "(z : GaussianInt) : IsUnit z ↔ z = 1 ∨ z = -1 ∨ z = ⟨0, 1⟩ ∨ z = ⟨0, -1⟩", "i": "The units of ℤ[i] are exactly 1, -1, i, -i — by Zsqrtd.norm_eq_one_iff' a unit has norm re^2 + im^2 = 1, forcing (re, im) ∈ {(±1, 0), (0, ±1)}; the converse is a direct check.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_zsqrtd_neg_five_isUnit_iff", "k": "proved", "d": "代数", "s": "(z : Zsqrtd (-5)) : IsUnit z ↔ z = 1 ∨ z = -1", "i": "The only units of ℤ[√-5] are ±1 — by Zsqrtd.norm_eq_one_iff' (d ≤ 0) units are the elements with re^2 + 5 im^2 = 1, which forces im = 0 and re = ±1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_pisano_prime_not_dvd_succ_of_not_isSquare_five", "k": "proved", "d": "数论", "s": "(p : ℕ) [Fact p.Prime] (hp2 : p ≠ 2) (h : ¬ IsSquare (5 : ZMod p)) : ¬ p3_pisano p ∣ p + 1", "i": "Uses Mathlib2.bld5_prime_dvd_fib_succ_of_not_isSquare_five, Mathlib2.lib_pisano_dvd_iff_period and Mathlib2.lib_fib_period_iff: if π(p) ∣ p+1 then (lib_pisano_dvd_iff_period + lib_fib_period_iff) F_(p+2) ≡ 1 mod p. But p ∣ F_(p+1) (bld5 theorem) gives F_(p+2) ≡ F_p, and F_p ≡ 5^((p-1)/2) ≡ -1 mod p (Euler criterion, from 2^(p-1) F_p = ∑ C(p,2j+1) 5^j; or Cassini F_p^2 ≡ 1 plus F_(p-1) ≡ -F_p and p", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_isSquare_neg_three_zmod_iff", "k": "proved", "d": "数论", "s": "(p : ℕ) [Fact p.Prime] (hp : 3 < p) : IsSquare (-3 : ZMod p) ↔ p % 3 = 1", "i": "-3 is a quadratic residue mod a prime p > 3 iff p ≡ 1 (mod 3) — either via legendreSym multiplicativity, (-1/p) and quadratic reciprocity for 3, or directly: -3 = (2ω+1)^2 where ω is a primitive cube root of unity, which exists in F_p iff 3 | p-1.", "o": "conjecture", "c": 1, "r": ""}, {"n": "bld6_pisano_ten_pow", "k": "proved", "d": "数论", "s": "(k : ℕ) : p3_pisano (10 ^ (k + 3)) = 15 * 10 ^ (k + 2)", "i": "Uses Mathlib2.bld4_pisano_mul_of_coprime, Mathlib2.bld5_pisano_two_pow and Mathlib2.bld5_pisano_five_pow: 10^(k+3) = 2^(k+3)·5^(k+3) with coprime factors, so π = lcm(π(2^(k+3)), π(5^(k+3))) (bld4_pisano_mul_of_coprime) = lcm(3·2^(k+2), 4·5^(k+3)) by the two prime-power formulas; since k+2 ≥ 2 the lcm is 3·2^(k+2)·5^(k+3) = 15·10^(k+2).", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_pisano_two_pow_mul_five_pow_eq_six_mul_iff", "k": "proved", "d": "数论", "s": "(a b : ℕ) : p3_pisano (2 ^ (a + 1) * 5 ^ (b + 1)) = 6 * (2 ^ (a + 1) * 5 ^ (b + 1)) ↔ a = 0", "i": "Uses Mathlib2.bld4_pisano_mul_of_coprime, Mathlib2.bld5_pisano_two_pow and Mathlib2.bld5_pisano_five_pow: π(2^(a+1)5^(b+1)) = lcm(3·2^a, 4·5^(b+1)) by the coprime-lcm rule and the two prime-power formulas; this equals 12·5^(b+1) for a ≤ 1 and 3·2^a·5^(b+1) for a ≥ 2, i.e. 6n, 3n, 3n/2 respectively — so the extremal ratio π(n) = 6n occurs exactly for a = 0 (n = 2·5^(b+1)).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_irreducible_X_sq_add_X_add_one_zmod_iff", "k": "proved", "d": "多项式", "s": "(p : ℕ) [Fact p.Prime] : Irreducible (Polynomial.X ^ 2 + Polynomial.X + 1 : Polynomial (ZMod p)) ↔ p % 3 = 2", "i": "X^2 + X + 1 is irreducible over F_p iff p ≡ 2 (mod 3) — a monic quadratic is irreducible iff it has no root; for p = 3 it is (X-1)^2; for p ≠ 3 a root is exactly an element of multiplicative order 3, which exists iff 3 | p - 1 (cyclic unit group).", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_tsum_lucas_div_two_pow", "k": "proved", "d": "分析", "s": ": ∑' n : ℕ, (p3_lucas n : ℝ) / 2 ^ n = 6", "i": "Uses Mathlib2.calc_tsum_fib_div_two_pow and Mathlib2.lib_p3_lucas_cast: by lib_p3_lucas_cast L_n = 2F_(n+1) - F_n in ℝ; ∑ F_n/2^n = 2 (calc_tsum_fib_div_two_pow, also giving summability), and dropping the zero term n = 0 gives ∑ F_(n+1)/2^n = 2·2 = 4; so the sum is 2·4 - 2 = 6.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_integral_dalzell_companion", "k": "proved", "d": "分析", "s": ": ∫ x in (0:ℝ)..1, x ^ 6 * (1 - x) ^ 4 / (1 + x ^ 2) = Real.pi - 22 / 7 + 1 / 630", "i": "Uses Mathlib2.calc_integral_dalzell and Mathlib2.calc_integral_beta_nat: x^6(1-x)^4/(1+x^2) = x^4(1-x)^4 - x^4(1-x)^4/(1+x^2) pointwise; split the integral (intervalIntegral.integral_sub), the first piece is 1/630 by calc_integral_beta_nat 4 4 and the second is 22/7 - π by calc_integral_dalzell.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_pi_dalzell_beta_bounds", "k": "proved", "d": "分析", "s": ": 22 / 7 - 1 / 630 < Real.pi ∧ Real.pi < 22 / 7 - 1 / 1260", "i": "Uses Mathlib2.calc_integral_dalzell and Mathlib2.calc_integral_beta_nat: on (0,1) one has x^4(1-x)^4/2 < x^4(1-x)^4/(1+x^2) < x^4(1-x)^4; integrate (strict monotonicity of the interval integral for continuous functions). The middle integral is 22/7 - π by calc_integral_dalzell, the outer one is 4!4!/9! = 1/630 by calc_integral_beta_nat 4 4.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_tsum_inv_fib_mul_fib_add_two", "k": "proved", "d": "分析", "s": ": ∑' n : ℕ, 1 / ((Nat.fib (n + 1) : ℝ) * (Nat.fib (n + 3) : ℝ)) = 1", "i": "Uses Mathlib2.calc_tsum_inv_three_consecutive_aux1 (general telescoping HasSum lemma): take g n = 1/(F_(n+1) F_(n+2)); then g n - g (n+1) = (F_(n+3) - F_(n+1))/(F_(n+1)F_(n+2)F_(n+3)) = 1/(F_(n+1)F_(n+3)) by Nat.fib_add_two, g → 0 since F_(n+1) ≥ n/…→∞ (Nat.fib_lt_fib_succ / le_fib_self), and g 0 = 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_finrank_adjoin_sqrt_two_add_sqrt_three", "k": "proved", "d": "线性代数", "s": ": Module.finrank ℚ (IntermediateField.adjoin ℚ ({Real.sqrt 2 + Real.sqrt 3} : Set ℝ)) = 4", "i": "[ℚ(√2+√3) : ℚ] = 4 — IntermediateField.adjoin.finrank reduces to the degree of the minimal polynomial, which is X^4 - 10X^2 + 1; Uses Mathlib2.poly_x4_sub_10x2_add_1_irreducible_int (irreducibility over ℤ, hence over ℚ by Gauss) to identify the minimal polynomial.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_adjoin_sqrt_two_sqrt_three_eq_adjoin_sum", "k": "proved", "d": "分析", "s": ": IntermediateField.adjoin ℚ ({Real.sqrt 2, Real.sqrt 3} : Set ℝ) = IntermediateField.adjoin ℚ ({Real.sqrt 2 + Real.sqrt 3} : Set ℝ)", "i": "ℚ(√2, √3) = ℚ(√2 + √3): the sum is a primitive element — ⊇ is clear; for ⊆, with s = √2+√3 one has s^3 = 11√2 + 9√3, so √2 = (s^3 - 9s)/2 and √3 = (11s - s^3)/2 lie in ℚ(s).", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_tsum_inv_odd_sq_mul_odd_sq", "k": "proved", "d": "分析", "s": ": ∑' n : ℕ, 1 / ((2 * (n : ℝ) + 1) ^ 2 * (2 * (n : ℝ) + 3) ^ 2) = Real.pi ^ 2 / 16 - 1 / 2", "i": "Uses Mathlib2.calc_tsum_inv_odd_sq and Mathlib2.calc_tsum_inv_odd_consecutive: 1/(a^2(a+2)^2) = (1/4)(1/a^2 + 1/(a+2)^2) - (1/2)·1/(a(a+2)) with a = 2n+1. The sum of 1/a^2 is π^2/8 (calc_tsum_inv_odd_sq), the shifted sum is π^2/8 - 1, and the sum of 1/(a(a+2)) is 1/2 (calc_tsum_inv_odd_consecutive): total (1/4)(π^2/4 - 1) - 1/4.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_sum_choose_alternating_div_eq_beta", "k": "proved", "d": "组合与图论", "s": "(m n : ℕ) : ∑ k ∈ Finset.range (n + 1), (-1 : ℝ) ^ k * (n.choose k : ℝ) / ((m : ℝ) + k + 1) = ((m.factorial : ℝ) * n.factorial) / ((m + n + 1).factorial : ℝ)", "i": "Uses Mathlib2.calc_integral_beta_nat: expand (1-x)^n by the binomial theorem, so x^m(1-x)^n = ∑ (-1)^k C(n,k) x^(m+k); integrate termwise over [0,1] (integral_pow) to get the left side, and the right side is the value of the same integral by calc_integral_beta_nat m n (final step).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_sqrt_three_not_in_Q_sqrt_two", "k": "proved", "d": "分析", "s": "(a b : ℚ) : Real.sqrt 3 ≠ (a : ℝ) + (b : ℝ) * Real.sqrt 2", "i": "√3 ∉ ℚ(√2) — squaring gives 3 = a^2 + 2b^2 + 2ab√2, so ab = 0 by irrationality of √2; b = 0 gives √3 = a rational, a = 0 gives 3 = 2b^2, i.e. (2b)^2 = 6, contradicting irrationality of √6.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_lcm_mul_integral_central_beta_nat", "k": "proved", "d": "分析", "s": "(n : ℕ) : ∃ q : ℕ, 0 < q ∧ (((Finset.Icc 1 (2 * n)).lcm id : ℕ) : ℝ) * (2 * (n : ℝ) + 1) * (∫ x in (0:ℝ)..1, (x * (1 - x)) ^ n) = (q : ℝ)", "i": "Uses Mathlib2.calc_integral_beta_nat and Mathlib2.arith_centralBinom_dvd_lcm: by mul_pow and calc_integral_beta_nat n n the integral is (n!)^2/(2n+1)! = 1/((2n+1)·centralBinom n) (Nat.centralBinom, Nat.choose factorial formula); so the left side equals lcm(1..2n)/centralBinom n, which is a positive natural number q by arith_centralBinom_dvd_lcm (Nair's integrality argument made explicit).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_cbrt_two_not_in_Q_sqrt_two", "k": "proved", "d": "分析", "s": "(x : ℝ) (hx : x ^ 3 = 2) (a b : ℚ) : x ≠ (a : ℝ) + (b : ℝ) * Real.sqrt 2", "i": "The cube root of 2 does not lie in ℚ(√2) — expand (a + b√2)^3 = (a^3 + 6ab^2) + (3a^2 b + 2b^3)√2 = 2; irrationality of √2 forces b(3a^2 + 2b^2) = 0, so b = 0 and a^3 = 2; Uses Mathlib2.alg_rat_pow_ne_two at this last step.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_sum_quadratic_residues_one_mod_four", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (h : p % 4 = 1) : ∑ a ∈ (Finset.Icc 1 (p - 1)).image (fun x => x ^ 2 % p), a = p * (p - 1) / 4", "i": "For a prime p ≡ 1 (mod 4) the sum of the quadratic residues in [1, p-1] equals p(p-1)/4 — -1 is a residue, so r ↦ p - r is a fixed-point-free involution on the (p-1)/2 residues, pairing them into (p-1)/4 pairs each of sum p.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_pow_char_eq_self_iff_natCast", "k": "proved", "d": "数论", "s": "(K : Type) [Field K] (p : ℕ) [Fact p.Prime] [CharP K p] (x : K) : x ^ p = x ↔ ∃ n : ℕ, x = (n : K)", "i": "In any field of characteristic p the fixed points of Frobenius are exactly the prime field: x^p = x iff x is the image of a natural number — (←) Fermat's little theorem in ZMod p pushed along the cast; (→) X^p - X has at most p roots in K and the p distinct elements 0, 1, …, p-1 are roots, so they are all the roots.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_gaussianInt_one_add_i_prime", "k": "proved", "d": "代数", "s": ": Prime (⟨1, 1⟩ : GaussianInt)", "i": "1 + i is prime in ℤ[i] — its norm is 2, a rational prime, so it is irreducible (a factorization gives norms multiplying to 2, one factor is a unit); ℤ[i] is a Euclidean domain hence a PID, so irreducible implies prime.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_eval_eq_zero_forall_iff_dvd", "k": "proved", "d": "多项式", "s": "(K : Type) [Field K] [Fintype K] (f : Polynomial K) : (∀ a : K, Polynomial.eval a f = 0) ↔ (Polynomial.X ^ Fintype.card K - Polynomial.X) ∣ f", "i": "A polynomial over a finite field F_q vanishes at every point iff it is divisible by X^q - X — X^q - X = ∏_{a} (X - a) (FiniteField.roots_X_pow_card_sub_X, separable with all q roots); the factors X - a are pairwise coprime, so each dividing f gives the product dividing f; the converse is FiniteField.pow_card.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_pow_bijective_iff_coprime", "k": "proved", "d": "数论", "s": "(K : Type) [Field K] [Fintype K] (k : ℕ) (hk : 0 < k) : Function.Bijective (fun x : K => x ^ k) ↔ Nat.Coprime k (Fintype.card K - 1)", "i": "For k > 0 the power map x ↦ x^k is a permutation of F_q iff gcd(k, q-1) = 1 — it fixes 0 and on the cyclic group of units of order q-1 the k-th power map is injective iff gcd(k, q-1) = 1 (if d = gcd > 1 there is an element of order d in the kernel; conversely use Bezout u*k ≡ 1 mod q-1).", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_irrational_cos_pi_div_nine", "k": "proved", "d": "分析", "s": ": Irrational (Real.cos (Real.pi / 9))", "i": "cos(π/9) = cos 20° is irrational — by the triple angle formula c = cos(π/9) satisfies 8c^3 - 6c - 1 = 0 (cos(π/3) = 1/2); 2c is a root of the monic integer polynomial y^3 - 3y - 1, so if rational it is an integer dividing 1, but ±1 are not roots.", "o": "conjecture", "c": 0, "r": ""}, {"n": "fld_irrational_exp_one", "k": "proved", "d": "分析", "s": ": Irrational (Real.exp 1)", "i": "e is irrational (Fourier's proof) — if e = a/b then b!·(e - Σ_{k≤b} 1/k!) is an integer, but it equals Σ_{k>b} b!/k!, which lies strictly between 0 and 1/b ≤ 1 (bound the tail by a geometric series; Real.exp_bound / the series expansion of exp).", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_chebyshev_T_separable", "k": "proved", "d": "多项式", "s": "(n : ℕ) : (Polynomial.Chebyshev.T ℝ (n : ℤ)).Separable", "i": "Uses Mathlib2.poly_chebyshev_T_card_distinct_real_roots and Mathlib2.lib_chebyshev_T_natDegree_le: n = #distinct roots ≤ card roots ≤ natDegree ≤ n (the first equality from the poly theorem, the last bound from the lib lemma), so T_n has natDegree n, splits over ℝ with all roots simple; a polynomial with natDegree-many distinct roots is squarefree, hence separable in characteristic 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_chebyshev_T_derivative_card_distinct_real_roots", "k": "proved", "d": "多项式", "s": "(n : ℕ) : (Polynomial.derivative (Polynomial.Chebyshev.T ℝ (n : ℤ))).roots.toFinset.card = n - 1", "i": "Uses Mathlib2.poly_chebyshev_T_card_distinct_real_roots and Mathlib2.lib_chebyshev_T_natDegree_le: Rolle (Polynomial.card_roots_toFinset_le_derivative) gives n = #roots(T_n) ≤ #roots(T_n') + 1 using the poly theorem; conversely #roots(T_n') ≤ natDegree T_n' ≤ natDegree T_n - 1 ≤ n - 1 by the lib degree bound (the cases n = 0, 1 give the zero / constant derivative).", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_poly_mul_add_one_eq_pow_const", "k": "proved", "d": "多项式", "s": "{k : Type*} [Field k] [DecidableEq k] [CharZero k] (n : ℕ) (hn : 2 ≤ n) (f h : Polynomial k) (heq : f * (f + 1) = h ^ n) : f.natDegree = 0", "i": "Uses Mathlib2.poly_no_consecutive_powerful: f and f+1 are coprime, so in the UFD k[X] any irreducible p dividing f has p-adic multiplicity in f equal to its multiplicity in h^n, a multiple of n ≥ 2, hence p^2 ∣ f; same for f+1. Both powerfulness hypotheses of poly_no_consecutive_powerful hold, giving natDegree f = 0 (last step).", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_card_circular_no_adjacent_subsets", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : ((Finset.univ : Finset (Finset (Fin (n + 1)))).filter (fun s => ∀ i : Fin (n + 1), ∀ j : Fin (n + 1), i ∈ s → j ∈ s → ((i : ℕ) + 1) % (n + 1) ≠ (j : ℕ))).card = Nat.fib n + Nat.fib (n + 2)", "i": "Uses Mathlib2.calc_card_no_adjacent_subsets: split cyclically non-adjacent subsets of Z/(n+1) by whether the last point n belongs to s. If not, s is a linear non-adjacent subset of Fin n: fib(n+2) of them by calc_card_no_adjacent_subsets n; if yes (n ≥ 2), then 0 and n-1 are excluded and the rest is a linear non-adjacent subset of the n-2 middle points: fib n by calc_card_no_adjacent_subsets (n-2)", "o": "conjecture", "c": 0, "r": ""}, {"n": "bld6_abundant_two_mul_totient_lt", "k": "proved", "d": "数论", "s": "(n : ℕ) (hn : 2 ≤ n) (h : 2 * n ≤ ArithmeticFunction.sigma 1 n) : 2 * n.totient < n", "i": "Uses Mathlib2.arith_sigma_mul_totient_lt_sq: 2n·φ(n) ≤ σ(n)·φ(n) < n^2 by the hypothesis and arith_sigma_mul_totient_lt_sq; cancel n > 0. So perfect and abundant numbers have φ(n) < n/2.", "o": "c 1 means constant (3 functions), and all functions number 3^n, so size 2 occurs 3^n - (3^n - 3·2^n + 3) - 3 = 3·2^n - 6 times.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gr_mantel_equality_compl_not_connected", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (h : G.CliqueFree 3) (he : 4 * G.edgeFinset.card = Fintype.card V ^ 2) : ¬ Gᶜ.Connected", "i": "The complement of an extremal triangle-free graph is disconnected — Uses Mathlib2.bld4_mantel_equality_complete_bipartite at step 1 to get s with 2|s| = n and Adj x y ↔ (x ∈ s ↔ y ∉ s); then Gᶜ has no edge between s and sᶜ; if n = 0 Connected fails by emptiness, otherwise both sides are nonempty and a Gᶜ-walk from s to sᶜ would need a crossing edge.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gr_ramsey_three_four_le_ten", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] (h : 10 ≤ Fintype.card V) (G : SimpleGraph V) : ¬ G.CliqueFree 3 ∨ ¬ Gᶜ.CliqueFree 4", "i": "R(3,4) ≤ 10: every graph on at least 10 vertices has a triangle or an independent 4-set — pick v; if v has ≥ 4 neighbours, either two are adjacent (triangle with v) or 4 of them form an independent set; otherwise v has ≥ 6 non-neighbours, and Uses Mathlib2.r3_ramsey_three_three at this step on the induced graph on the non-neighbours: a triangle there is a triangle of G, an independent triple plus ", "o": "conjecture", "c": 0, "r": ""}], "featured": [{"name": "bld6_pi_dalzell_beta_bounds", "domain": "分析", "title": "22/7 比圆周率大多少，被精确夹住了", "plain": "课本里常用 22/7 ≈ 3.1429 近似圆周率 π，它比 π 稍大一点。这里严格证明了：22/7 − 1/630 < π < 22/7 − 1/1260，也就是 22/7 的误差落在 1/1260 到 1/630 之间。", "why": "用两个巧妙的积分把一个两千年前的近似值的误差算得清清楚楚。证明直接用到了库里先证好的两个积分公式。", "known": "已知：这个积分出自 Dalzell（1944），两边的界也是经典结果"}, {"name": "bld6_pisano_ten_pow", "domain": "数论", "title": "斐波那契数的末三位，每 1500 个循环一次", "plain": "斐波那契数列是 1, 1, 2, 3, 5, 8, 13, 21……（每项等于前两项之和）。只看末三位数，它每 1500 项重复一次；只看末四位，每 15000 项重复一次；一般地，末 n 位（n ≥ 3）每 15 × 10ⁿ⁻¹ 项重复一次。", "why": "这个结论由库里另外三条定理拼出来：模 2 的幂、模 5 的幂的循环长度，以及“互素时循环长度取最小公倍数”。体现了库在一层层往上搭。", "known": "已知：斐波那契数模 m 的循环长度由 Wall（1960）系统研究，这个公式是经典结果"}, {"name": "r3_ramsey_three_three", "domain": "组合与图论", "title": "任意 6 个人里，总有 3 个互相认识或互不认识", "plain": "不管 6 个人之间的认识关系怎样，总能找到 3 个人两两都认识，或者 3 个人两两都不认识。5 个人就不一定。", "why": "著名的“聚会问题”，是拉姆齐理论的起点。", "known": "已知：拉姆齐理论的经典入门结论"}, {"name": "fld_irrational_exp_one", "domain": "数论", "title": "自然常数 e 不是分数", "plain": "e ≈ 2.71828 是复利和指数增长里出现的常数。这里证明了它不能写成两个整数之比。", "why": "经典名题，用计算机能逐步核对的方式完整证了一遍。", "known": "已知：欧拉在 18 世纪证明"}, {"name": "arith_least_odd_abundant", "domain": "数论", "title": "945 是最小的奇“丰盈数”", "plain": "如果一个数的所有真因数加起来比它本身还大，就叫丰盈数，比如 12（1+2+3+4+6 = 16 > 12）。偶数里丰盈数很多，奇数里第一个是 945（真因数之和是 975）。", "why": "一个具体、好验证的事实，计算机把比 945 小的所有奇数都检查过了。", "known": "已知：早就算出来的经典事实"}, {"name": "ms_flt_poly", "domain": "多项式", "title": "多项式版的费马大定理", "plain": "费马大定理说 xⁿ + yⁿ = zⁿ（n ≥ 3）没有正整数解，证明花了 350 多年。换成多项式，结论同样成立，而且有短得多的证明：除了常数，找不到满足 aⁿ + bⁿ = cⁿ 的互素多项式。", "why": "来自一篇被审核的论文（Mason–Stothers 定理）。这篇论文的结论之后又被用来证明了 10 条新命题。", "known": "已知：Mason–Stothers 定理（1981、1983）的经典推论"}, {"name": "calc_tsum_millin", "domain": "分析", "title": "一串斐波那契数的倒数，加起来恰好是 (7 − √5)/2", "plain": "取斐波那契数列的第 1、2、4、8、16……项（1, 1, 3, 21, 987……），把它们的倒数无穷地加下去：1 + 1 + 1/3 + 1/21 + 1/987 + …，和恰好等于 (7 − √5)/2 ≈ 2.382。", "why": "无穷多项相加得到一个精确的、带根号的值，这类等式很少见。", "known": "已知：1974 年由 Millin 提出并很快被证明"}, {"name": "fld_prime_one_mod_three_eq_sq_add_three_sq", "domain": "数论", "title": "除以 3 余 1 的素数，都能写成 a² + 3b²", "plain": "比如 7 = 2² + 3×1²，13 = 1² + 3×2²，19 = 4² + 3×1²。对每一个除以 3 余 1 的素数，都能找到这样的 a 和 b。", "why": "证明过程中顺带整理出了一条通用工具（Thue 引理），之后又被用来证明类似的 a² + 2b² 定理。", "known": "已知：费马提出，欧拉证明"}, {"name": "arith_odd_perfect_euler_form", "domain": "数论", "title": "如果奇完全数存在，它必须长成特定的样子", "plain": "完全数是真因数之和恰好等于自身的数，比如 6 = 1+2+3、28。至今没人知道有没有奇数的完全数。欧拉证明过：如果有，它一定等于 pᵃ × m²，其中 p 是除以 4 余 1 的素数，a 也除以 4 余 1。", "why": "数学中最古老的未解问题之一的一个经典限制条件，这里被完整地形式化证明了。", "known": "已知：欧拉的定理"}, {"name": "r3_imo1988_vieta_jumping", "domain": "数论", "tit   return `<article class="card">
    <div class="row"><span class="badge">${esc(f.domain)}</span>${f.known ? '<span class="badge">已知结论</span>' : '<span class="badge warn">可能是新结论</span>'}</div>
    <h3>${esc(f.title)}</h3>
    <p class="plain">${esc(f.plain)}</p>
    ${f.known ? `<p class="why">${esc(f.known)}</p>` : ''}
    <details><summary>计算机里的写法</summary><pre>${esc(e.s)}</pre><div class="lean-name">Mathlib2.${esc(e.n)}</div></details>
  </article>`;
}).join('');

const STATUS = {error:['bad','发现错误'], imprecise:['warn','有不严谨处'], ok:['ok','全部成立'], pending:['idle','进行中']};
$('papers').innerHTML = DATA.papers.map(p => {
  const [cls, label] = STATUS[p.status] || ['idle', p.status];
  return `<div class="paper">
    <div class="verdict"><span class="badge ${cls}"><span class="dot"></span>${esc(label)}</span></div>
    <div class="body"><h3>${esc(p.topic)}</h3><p class="sub">${esc(p.short || p.finding)}</p>
      <details><summary>详情</summary><p class="sub">${esc(p.finding)}</p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.id)}</a></details></div>
  </div>`;
}).join('');

$('experts-summary').textContent = `给数学家：查看全部 ${S.theorems} 条定理（可搜索、收藏）`;
$('dom').innerHTML = '<option value="">全部领域</option>' + DATA.domains.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
let picked = new Set();
try { picked = new Set(JSON.parse(localStorage.getItem('forge-picks') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('forge-picks', JSON.stringify([...picked])); } catch (e) {} };
const ORIGIN = {paper:'来自论文', conjecture:'AI 猜想', decomposition:'拆出的引理', human:'人提的问题'};
const REVIEW = {faithful:['ok','复核：忠实'], unfaithful:['bad','复核：不忠实'], unsure:['warn','复核：存疑']};
let shown = 40;

function filtered() {
  const q = $('q').value.trim().toLowerCase(), d = $('dom').value, k = $('kind').value;
  let rows = DATA.entries.filter(e => (!d || e.d === d) && (!k || e.k === k) &&
    (!q || (e.n + ' ' + e.s + ' ' + e.i).toLowerCase().includes(q)));
  rows.sort($('sort').value === 'name' ? (a, b) => a.n.localeCompare(b.n) : (a, b) => b.c - a.c || a.n.localeCompare(b.n));
  return rows;
}
function render() {
  const rows = filtered();
  $('count').textContent = `共 ${rows.length} 条`;
  $('list').innerHTML = rows.slice(0, shown).map(e => {
    const review = REVIEW[e.r];
    return `<div class="item ${picked.has(e.n) ? 'picked' : ''}">
      <div class="row"><span class="lean-name">${esc(e.n)}</span>
        <span class="badge">${esc(e.d)}</span>
        ${e.k === 'disproved' ? '<span class="badge bad">证伪</span>' : ''}
        ${ORIGIN[e.o] ? `<span class="badge">${ORIGIN[e.o]}</span>` : ''}
        ${review ? `<span class="badge ${review[0]}">${review[1]}</span>` : ''}
        ${e.c ? `<span class="badge">被引用 ${e.c} 次</span>` : ''}
        <button class="star" data-n="${esc(e.n)}" aria-pressed="${picked.has(e.n)}">${picked.has(e.n) ? '已收藏' : '收藏'}</button></div>
      ${e.i ? `<p class="informal">${esc(e.i)}</p>` : ''}
      <details><summary>Lean 原文</summary><pre>${esc(e.s)}</pre></details>
    </div>`;
  }).join('') || '<div class="item"><p class="informal">没有符合条件的定理。换个关键词或清除筛选试试。</p></div>';
  $('more').hidden = rows.length <= shown;
  $('pickcount').textContent = `${picked.size} 条`;
  $('export').value = [...picked].sort().map(n => `Mathlib2.${n}`).join('\n');
}
['q', 'dom', 'kind', 'sort'].forEach(id => $(id).addEventListener('input', () => { shown = 40; render(); }));
$('more').addEventListener('click', () => { shown += 60; render(); });
$('list').addEventListener('click', ev => {
  const b = ev.target.closest('.star'); if (!b) return;
  const n = b.dataset.n; picked.has(n) ? picked.delete(n) : picked.add(n); save(); render();
});
$('copy').addEventListener('click', () => {
  const text = $('export').value;
  if (!text) { $('copied').textContent = '还没有收藏任何定理'; return; }
  const done = () => { $('copied').textContent = '已复制'; };
  navigator.clipboard?.writeText(text).then(done, () => { $('export').select(); $('copied').textContent = '已选中，按复制键即可'; })
    ?? ($('export').select(), $('copied').textContent = '已选中，按复制键即可');
});
$('footer').innerHTML = `<p>库里还有 ${S.waiting} 道题在排队等待证明。所有证明只依赖三条数学界公认的基本公理。</p>
  <p>数据生成于 ${esc(S.generated)}。</p>`;
render();
</script>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathlib2-demo"
version = "0.3.0"
description = "本地优先的数学发现与 Lean 验证演示"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.67,<2"]

[project.optional-dependencies]
pdf = ["pypdf>=5,<7", "fonttools>=4.60,<5"]

[project.scripts]
mathlib2 = "mathlib2.cli:main"

[tool.setuptools.packages.find]
include = ["mathlib2*"]

<title>定理铸造厂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* 布局：单列阅读流。先给结论（一句话 + 四个数字），再解释“计算机检查”，然后精选成果、论文体检、领域分布，
   最后才是给数学家的全部定理。视觉沿用 shadcn 的中性色、细边框和徽章；唯一的强调色是“已证实”的绿。 */
:root{
  --bg:#fafafa; --card:#ffffff; --fg:#0a0a0b; --muted:#6b6b74; --line:#e5e5e8; --soft:#f3f3f5;
  --primary:#18181b; --primary-fg:#fafafa; --ok:#047857; --ok-soft:#e7f6ef; --warn:#a15c07; --warn-soft:#fdf3e2;
  --bad:#c02626; --bad-soft:#fdecec; --idle:#6b6b74; --idle-soft:#f1f1f3;
  --sans:"Geist","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Geist Mono","SF Mono",Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090b; --card:#111114; --fg:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --soft:#18181b;
  --primary:#f4f4f5; --primary-fg:#18181b; --ok:#34d399; --ok-soft:#0d2a20; --warn:#fbbf24; --warn-soft:#2b2110;
  --bad:#f87171; --bad-soft:#2d1414; --idle:#a1a1aa; --idle-soft:#1c1c20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --card:#111114; --fg:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --soft:#18181b;
  --primary:#f4f4f5; --primary-fg:#18181b; --ok:#34d399; --ok-soft:#0d2a20; --warn:#fbbf24; --warn-soft:#2b2110;
  --bad:#f87171; --bad-soft:#2d1414; --idle:#a1a1aa; --idle-soft:#1c1c20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:56px}
section{display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(26px,4.2vw,38px);line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:22ch}
h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:600;margin:0;line-height:1.45;text-wrap:balance}
p{margin:0}
.lede{color:var(--muted);font-size:17px;max-width:62ch}
.sub{color:var(--muted);max-width:66ch}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.brand{font-weight:600;color:var(--fg);font-size:15px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);background:var(--card);white-space:nowrap;line-height:1.7}
.badge.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.badge.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.badge.idle{color:var(--idle);background:var(--idle-soft);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.hero{display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .label{font-weight:500}
.stat .note{color:var(--muted);font-size:13px}
.stat.verified b{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .plain{font-size:15px}
.card .why{color:var(--muted);font-size:14px}
details{min-width:0}
summary{cursor:pointer;color:var(--muted);font-size:13px;width:fit-content;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";display:inline-block;margin-right:6px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary:hover{color:var(--fg)}
pre{margin:8px 0 0;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:13px;line-height:1.55;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.lean-name{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.papers{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.paper{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 20px;padding:16px 20px;border-top:1px solid var(--line)}
.paper:first-child{border-top:0}
.paper .verdict{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.paper .verdict .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.paper .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.paper a{color:var(--muted);font-family:var(--mono);font-size:12.5px;text-decoration:none;width:fit-content}
.paper a:hover{color:var(--fg);text-decoration:underline}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;font-size:14px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
input[type=search]{flex:1 1 260px;min-width:0}
button{font:inherit;font-size:14px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
button:hover{background:var(--soft)} button.primary:hover{opacity:.9;background:var(--primary)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.item{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.item:first-child{border-top:0}
.item .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .lean-name{color:var(--fg);font-size:13px}
.item .informal{color:var(--muted);font-size:14px;max-width:80ch}
.star{height:28px;padding:0 10px;font-size:13px;margin-left:auto}
.item.picked .star{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.more{align-self:center}
#export{width:100%;min-height:96px;font-family:var(--mono);font-size:13px;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
.experts>summary{font-size:15px;font-weight:500;color:var(--fg);border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:12px 16px;width:100%}
.experts-body{margin-top:16px}
footer{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
@media (max-width:820px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.paper{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header class="hero">
    <div class="top"><span class="brand">定理铸造厂</span><span class="badge">Mathlib2</span><span id="generated"></span></div>
    <h1 id="headline">AI 写下的数学定理，每一条都经过计算机逐步检查</h1>
    <p class="lede">AI 提出数学命题并写出证明，计算机逐步核对，有一步不严格就不收。这些大多是已知结论，哪些有价值由数学家判断。</p>
    <div class="stats" id="stats"></div>
  </header>

  <section aria-labelledby="featured-title">
    <h2 id="featured-title">精选成果</h2>
    <div class="grid" id="featured"></div>
  </section>

  <section aria-labelledby="papers-title">
    <h2 id="papers-title">论文体检</h2>
    <div class="papers" id="papers"></div>
  </section>

  <details class="experts">
    <summary id="experts-summary">给数学家：查看全部定理</summary>
    <section aria-label="全部定理" class="experts-body">
      <div class="tools">
        <input type="search" id="q" placeholder="搜索名称、命题或描述，例如 Fibonacci、∣、rank" aria-label="搜索定理">
        <select id="dom" aria-label="按领域筛选"></select>
        <select id="kind" aria-label="按结论筛选"><option value="">证明与证伪</option><option value="proved">只看证明</option><option value="disproved">只看证伪</option></select>
        <select id="sort" aria-label="排序"><option value="cited">被引用最多</option><option value="name">按名称</option></select>
        <span class="count" id="count"></span>
      </div>
      <div class="list" id="list"></div>
      <button class="more" id="more">显示更多</button>
      <div class="tools"><strong>我的收藏</strong><span class="count" id="pickcount"></span><button id="copy">复制清单</button><span class="count" id="copied" role="status"></span></div>
      <textarea id="export" readonly aria-label="收藏清单"></textarea>
    </section>
  </details>

  <footer id="footer"></footer>
</div>
<script>
const DATA = {"entries": [{"n": "nt_four_consec_add_one_is_square", "k": "proved", "d": "数论", "s": "(n : ℕ) : IsSquare (n * (n + 1) * (n + 2) * (n + 3) + 1)", "i": "The product of four consecutive naturals plus 1 is a perfect square.", "o": "conjecture", "c": 0, "r": ""}, {"n": "nt_pow5_sub_self_dvd_30", "k": "proved", "d": "数论", "s": "(n : ℤ) : 30 ∣ n ^ 5 - n", "i": "n^5 - n is divisible by 30 for every integer n.", "o": "conjecture", "c": 0, "r": ""}, {"n": "an_sum_cubes_eq_sq_sum", "k": "proved", "d": "数论", "s": "(n : ℕ) : ∑ i ∈ Finset.range (n + 1), i ^ 3 = (∑ i ∈ Finset.range (n + 1), i) ^ 2", "i": "Nicomachus: the sum of the first n cubes equals the square of the sum of the first n integers.", "o": "conjecture", "c": 0, "r": ""}, {"n": "nt_seven_dvd_sq_add_sq", "k": "proved", "d": "数论", "s": "(a b : ℤ) (h : 7 ∣ a ^ 2 + b ^ 2) : 7 ∣ a ∧ 7 ∣ b", "i": "If 7 divides a^2 + b^2 then 7 divides both a and b.", "o": "conjecture", "c": 1, "r": ""}, {"n": "an_sum_fib_sq", "k": "proved", "d": "数论", "s": "(n : ℕ) : ∑ i ∈ Finset.range (n + 1), Nat.fib i ^ 2 = Nat.fib n * Nat.fib (n + 1)", "i": "Sum of squares of Fibonacci numbers F_0..F_n equals F_n * F_{n+1}.", "o": "conjecture", "c": 0, "r": ""}, {"n": "an_cyclic_div_ge_three", "k": "proved", "d": "数论", "s": "(a b c : ℝ) (ha : 0 < a) (hb : 0 < b) (hc : 0 < c) : 3 ≤ a / b + b / c + c / a", "i": "For positive reals a, b, c: a/b + b/c + c/a ≥ 3.", "o": "conjecture", "c": 0, "r": ""}, {"n": "nt_nine_dvd_sum_cubes_three_dvd_prod", "k": "proved", "d": "数论", "s": "(a b c : ℤ) (h : 9 ∣ a ^ 3 + b ^ 3 + c ^ 3) : 3 ∣ a * b * c", "i": "If 9 divides a^3+b^3+c^3 then 3 divides abc.", "o": "conjecture", "c": 0, "r": ""}, {"n": "an_sum_mul_choose", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : ∑ k ∈ Finset.range (n + 2), k * Nat.choose (n + 1) k = (n + 1) * 2 ^ n", "i": "Sum over k ≤ m of k*C(m,k) equals m*2^(m-1), stated with m = n+1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "nt_prime_sq_sub_one_dvd_24", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (h : 3 < p) : 24 ∣ p ^ 2 - 1", "i": "For a prime p > 3, 24 divides p^2 - 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "nt_gcd_factorial_succ_add_one_disproof", "k": "disproved", "d": "数论", "s": "(n : ℕ) : Nat.gcd (Nat.factorial n + 1) (Nat.factorial (n + 1) + 1) = 1", "i": "[suspected false] n!+1 and (n+1)!+1 are always coprime (fails at n = 0, where both are 2).", "o": "conjecture", "c": 0, "r": ""}, {"n": "an_nesbitt", "k": "proved", "d": "数论", "s": "(a b c : ℝ) (ha : 0 < a) (hb : 0 < b) (hc : 0 < c) : 3 / 2 ≤ a / (b + c) + b / (c + a) + c / (a + b)", "i": "Nesbitt's inequality for positive reals.", "o": "conjecture", "c": 0, "r": ""}, {"n": "nt_gcd_21n4_14n3", "k": "proved", "d": "数论", "s": "(n : ℕ) : Nat.gcd (21 * n + 4) (14 * n + 3) = 1", "i": "The fraction (21n+4)/(14n+3) is irreducible (IMO 1959 P1).", "o": "conjecture", "c": 0, "r": ""}, {"n": "an_sqrt_add_le_sqrt_two_mul", "k": "proved", "d": "分析", "s": "(a b : ℝ) (ha : 0 ≤ a) (hb : 0 ≤ b) : Real.sqrt a + Real.sqrt b ≤ Real.sqrt (2 * (a + b))", "i": "For nonnegative a, b: sqrt a + sqrt b ≤ sqrt(2(a+b)).", "o": "conjecture", "c": 0, "r": ""}, {"n": "nt_seven_dvd_pow_sum", "k": "proved", "d": "数论", "s": "(n : ℕ) : 7 ∣ 3 ^ (2 * n + 1) + 2 ^ (n + 2)", "i": "7 divides 3^(2n+1) + 2^(n+2) for all n.", "o": "conjecture", "c": 0, "r": ""}, {"n": "nt_euler_poly_prime_disproof", "k": "disproved", "d": "数论", "s": "(n : ℕ) : Nat.Prime (n ^ 2 + n + 41)", "i": "[suspected false] Euler's polynomial n^2+n+41 is always prime (fails at n = 40).", "o": "conjecture", "c": 0, "r": ""}, {"n": "an_cassini_int", "k": "proved", "d": "数论", "s": "(n : ℕ) : (Nat.fib (n + 2) : ℤ) * (Nat.fib n : ℤ) - (Nat.fib (n + 1) : ℤ) ^ 2 = (-1) ^ (n + 1)", "i": "Cassini's identity: F_{n+2} F_n - F_{n+1}^2 = (-1)^{n+1} over the integers.", "o": "conjecture", "c": 8, "r": ""}, {"n": "an_telescoping_inv_mul", "k": "proved", "d": "数论", "s": "(n : ℕ) : ∑ i ∈ Finset.range n, (1 : ℝ) / (((i : ℝ) + 1) * ((i : ℝ) + 2)) = (n : ℝ)  2 + b ^ 2 = q * (a * b + 1) → (q * b - a) ^ 2 + b ^ 2 = q * ((q * b - a) * b + 1)", "i": "r3_imo1988_vieta_jumping 的证明骨架中第 2 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "r3_mordell_y_sq_eq_x_cube_add_seven_s1h2", "k": "proved", "d": "数论", "s": ": ∀ (a b : ℤ), b ^ 2 = a ^ 3 + 7 → a % 2 = 1", "i": "r3_mordell_y_sq_eq_x_cube_add_seven 的证明骨架中第 2 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "r3_imo1988_vieta_jumping_s1h3", "k": "proved", "d": "数论", "s": ": (∀ (q a b : ℕ), 0 < b → a ^ 2 + b ^ 2 = q * (a * b + 1) → a ≤ q * b) → (∀ (q a b : ℕ), a ≤ q * b → a ^ 2 + b ^ 2 = q * (a * b + 1) → (q * b - a) ^ 2 + b ^ 2 = q * ((q * b - a) * b + 1)) → ∀ (q a b : ℕ), 0 < b → b ≤ a → a ^ 2 + b ^ 2 = q * (a * b + 1) → q * b - a < a", "i": "r3_imo1988_vieta_jumping 的证明骨架中第 3 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "r3_mordell_y_sq_eq_x_cube_add_seven_s1h3", "k": "proved", "d": "数论", "s": ": ∀ (a : ℤ), a % 2 = 1 → (a ^ 2 - 2 * a + 4).natAbs % 4 = 3", "i": "r3_mordell_y_sq_eq_x_cube_add_seven 的证明骨架中第 3 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "r3_imo1988_vieta_jumping", "k": "proved", "d": "数论", "s": "(a b : ℕ) (h : a * b + 1 ∣ a ^ 2 + b ^ 2) : ∃ k : ℕ, a ^ 2 + b ^ 2 = k ^ 2 * (a * b + 1)", "i": "IMO 1988 Q6: if ab+1 divides a^2+b^2 then the quotient is a perfect square. Proof idea: Vieta jumping — fix the quotient q, take a solution with a+b minimal and a ≥ b, the other root a' = q b - a = (b^2 - q)/a of the quadratic satisfies 0 ≤ a' < a (needs a' ≥ 0 from positivity of a'b+1), so minimality forces a' = 0 and q = b^2.", "o": "conjecture", "c": 0, "r": ""}, {"n": "r3_ramsey_three_three_s1h1", "k": "proved", "d": "组合与图论", "s": ": ∀ (V : Type) [inst : Fintype V], 6 ≤ Fintype.card V → ∀ (G H : SimpleGraph V) (x y z : V), H.Adj x y → H.Adj x z → H.Adj y z → ¬H.CliqueFree 3", "i": "r3_ramsey_three_three 的证明骨架中第 1 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "r3_mordell_y_sq_eq_x_cube_add_seven_s1h1", "k": "proved", "d": "数论", "s": ": ∀ (N : ℕ), N tinct (for i<j one of the two coordinates strictly grows); if all labels lay in [1,r]×[1,s] pigeonhole would be violated.", "o": "conjecture", "c": 1, "r": ""}, {"n": "r3_fermat_fourth_pow_sub_ne_sq", "k": "proved", "d": "数论", "s": "(x y z : ℤ) (hy : y ≠ 0) (hz : z ≠ 0) : x ^ 4 - y ^ 4 ≠ z ^ 2", "i": "Fermat: x^4 - y^4 = z^2 has no integer solutions with yz ≠ 0 (equivalently, no Pythagorean triangle has square area). Mathlib only has the companion not_fermat_42 (a^4 + b^4 ≠ c^2). Proof idea: infinite descent on x: reduce to gcd(x,y)=1; if z odd then (z, y^2, x^2) is a primitive Pythagorean triple, parametrize x^2 = m^2+n^2, y^2 = m^2-n^2 giving m^4 - n^4 = (xy)^2 with smaller m; if z even then ", "o": "conjecture", "c": 0, "r": ""}, {"n": "sophie_germain_gt_three_mod_six", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : is_sophie_germain_prime p) (h3 : 3 < p) : p % 6 = 5", "i": "大于 3 的 Sophie Germain 素数模 6 余 5", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_unique_right_inverse_is_left_inverse", "k": "proved", "d": "代数", "s": "(R : Type*) [Ring R] (a b : R) (h : a * b = 1) (hu : ∀ c : R, a * c = 1 → c = b) : b * a = 1", "i": "In a ring, if a has a unique right inverse b then b is also a left inverse — apply uniqueness to c = b + (1 - b*a), which satisfies a*c = 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_tendsto_quadratic_ratio", "k": "proved", "d": "分析", "s": ": Filter.Tendsto (fun n : ℕ => (((n : ℝ)) ^ 2 + 1) / (2 * ((n : ℝ)) ^ 2 + 3)) Filter.atTop (nhds (1 / 2))", "i": "(n^2+1)/(2n^2+3) tends to 1/2 — divide numerator and denominator by n^2 and use 1/n^2 → 0, or bound |difference| = 1/(2(2n^2+3)) and squeeze.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_three_consecutive_pow_mul_comm", "k": "proved", "d": "代数", "s": "(G : Type*) [Group G] (n : ℕ) (h0 : ∀ a b : G, (a * b) ^ n = a ^ n * b ^ n) (h1 : ∀ a b : G, (a * b) ^ (n + 1) = a ^ (n + 1) * b ^ (n + 1)) (h2 : ∀ a b : G, (a * b) ^ (n + 2) = a ^ (n + 2) * b ^ (n + 2)) : ∀ a b : G, a * b = b * a", "i": "If (ab)^i = a^i b^i for three consecutive exponents i then the group is abelian (Herstein) — from n and n+1 get a^n b = b a^n, from n+1 and n+2 get a^(n+1) b = b a^(n+1), then cancel.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_hasSum_inv_mul_succ", "k": "proved", "d": "分析", "s": ": HasSum (fun n : ℕ => 1 / (((n : ℝ) + 1) * ((n : ℝ) + 2))) 1", "i": "The telescoping series sum 1/((n+1)(n+2)) equals 1 — partial sums are 1 - 1/(N+1) by induction; conclude with hasSum_iff_tendsto_nat_of_nonneg.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_card_two_pow_of_mul_self_eq_one", "k": "proved", "d": "代数", "s": "(G : Type*) [Group G] [Finite G] (h : ∀ g : G, g * g = 1) : ∃ k : ℕ, Nat.card G = 2 ^ k", "i": "A finite group in which every element squares to 1 has order a power of 2 — it is a 2-group (IsPGroup 2), then use IsPGroup.iff_card; or Cauchy's theorem for an odd prime divisor.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_integral_x_mul_exp", "k": "proved", "d": "分析", "s": ": (∫ x in (0 : ℝ)..1, x * Real.exp x) = 1", "i": "The integral of x e^x over [0,1] is 1 — the antiderivative is (x-1)e^x; apply the fundamental theorem of calculus (integral_eq_sub_of_hasDerivAt).", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_rat_pow_ne_two", "k": "proved", "d": "代数", "s": "(n : ℕ) (hn : 2 ≤ n) (q : ℚ) : q ^ n ≠ 2", "i": "X^n - 2 has no rational root for n ≥ 2 — rational root theorem / compare 2-adic valuations: n * v_2(q) = 1 is impossible.", "o": "conjecture", "c": 3, "r": ""}, {"n": "ana_integral_x_mul_sin", "k": "proved", "d": "分析", "s": ": (∫ x in (0 : ℝ)..Real.pi, x * Real.sin x) = Real.pi", "i": "The integral of x sin x over [0,π] is π — the antiderivative is sin x - x cos x; apply the fundamental theorem of calculus.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_center_index_not_prime", "k": "proved", "d": "代数", "s": "(G : Type*) [Group G] : ¬ (Subgroup.center G).index.Prime", "i": "The index of the center of a group is never a prime — if [G : Z(G)] = p then G/Z(G) is cyclic, so G is abelian and the index is 1.", "o": "conjecture", "c": 2, "r": ""}, {"n": "lin_involution_eigenvalue", "k": "proved", "d": "线性代数", "s": "(V : Type) [AddCommGroup V] [Module ℝ V] (f : Module.End ℝ V) (hf : f * f = 1) (μ : ℝ) (h : Module.End.HasEigenvalue f μ) : μ = 1 ∨ μ = -1", "i": "Every eigenvalue of a linear involution is 1 or -1 — take an eigenvector v; v = f (f v) = μ² v with v ≠ 0 gives μ² = 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_exists_two_vertices_same_degree", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (h : 2 ≤ Fintype.card V) : ∃ u v : V, u ≠ v ∧ G.degree u = G.degree v", "i": "Every finite simple graph on at least two vertices has two distinct vertices of equal degree — degrees lie in {0..n-1}; if injective, degree is a bijection onto range n, so some vertex has degree 0 and another degree n-1, contradiction since the latter is adjacent to the former.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_exp_ge_cubic_taylor", "k": "proved", "d": "分析", "s": "(x : ℝ) : 1 + x + x ^ 2 / 2 + x ^ 3 / 6 ≤ Real.exp x", "i": "The cubic Taylor polynomial of exp is a lower bound on all of ℝ (odd degree) — g = exp - T3 has g' = exp - T2 ≥ ... ; iterate: exp - (1+x) ≥ 0 everywhere, so exp - T2 is increasing with zero at 0, so exp - T3 has a minimum 0 at 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_gram_det_nonneg", "k": "proved", "d": "线性代数", "s": "(V : Type) [NormedAddCommGroup V] [InnerProductSpace ℝ V] (x y : V) : 0 ≤ Matrix.det !![inner ℝ x x, inner ℝ x y; inner ℝ y x, inner ℝ y y]", "i": "The 2×2 Gram determinant of two vectors in a real inner product space is nonnegative — expand with det_fin_two; it is Cauchy–Schwarz ⟨x,y⟩² ≤ ⟨x,x⟩⟨y,y⟩ plus symmetry of the inner product.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_connected_of_min_degree_half", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] [Nonempty V] (G : SimpleGraph V) [DecidableRel G.Adj] (h : ∀ v : V, Fintype.card V ≤ 2 * G.degree v + 1) : G.Connected", "i": "A graph on n vertices with every degree ≥ (n-1)/2 is connected — two non-adjacent vertices u ≠ v have neighbourhoods inside V \\ {u,v} (n-2 elements) of total size ≥ n-1, so they share a neighbour; hence any two vertices are at distance ≤ 2.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_log_one_add_ge_quadratic", "k": "proved", "d": "分析", "s": "(x : ℝ) (hx : 0 ≤ x) : x - x ^ 2 / 2 ≤ Real.log (1 + x)", "i": "log(1+x) ≥ x - x^2/2 for x ≥ 0 — the difference vanishes at 0 and has derivative 1/(1+x) - 1 + x = x^2/(1+x) ≥ 0, so it is monotone on [0,∞).", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_odd_card_order_two_of_even_card", "k": "proved", "d": "代数", "s": "(G : Type*) [Group G] [Finite G] (h : Even (Nat.card G)) : Odd (Nat.card {g : G // orderOf g = 2})", "i": "In a finite group of even order the number of elements of order exactly 2 is odd — pair g with g⁻¹: the elements with g ≠ g⁻¹ come in pairs, so |{g : g² = 1}| is even, and removing the identity leaves an odd number.", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_commutator_ne_one", "k": "proved", "d": "线性代数", "s": "(n : ℕ) (A B : Matrix (Fin (n + 1)) (Fin (n + 1)) ℝ) : A * B - B * A ≠ 1", "i": "A commutator of real square matrices of positive size is never the identity — take traces: tr(AB − BA) = 0 by trace_mul_comm while tr I = n + 1 ≠ 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_card_even_card_powerset", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : ((Finset.range (n + 1)).powerset.filter (fun s => Even s.card)).card = 2 ^ n", "i": "A nonempty (n+1)-set has exactly 2^n subsets of even size — toggling membership of a fixed element is an involution of the powerset swapping even-size and odd-size subsets; alternatively use Finset.sum_powerset_neg_one_pow_card or Nat.sum_range_choose with the alternating sum.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_sin_ge_cubic_of_nonneg", "k": "proved", "d": "分析", "s": "(x : ℝ) (hx : 0 ≤ x) : x - x ^ 3 / 6 ≤ Real.sin x", "i": "sin x ≥ x - x^3/6 for every x ≥ 0 (Mathlib only has it for x ≤ 1) — differentiate twice: the derivative cos x - 1 + x^2/2 is nonnegative by Real.one_sub_sq_div_two_le_cos, so the difference is monotone from value 0 at 0.", "o": "conjecture", "c": 2, "r": ""}, {"n": "r3_wolstenholme_harmonic_s1h1", "k": "proved", "d": "数论", "s": ": ∀ (p : ℕ), Nat.Prime p → 5 ≤ p → ∀ k ∈ Finset.Icc 1 (p - 1), (p - 1).factorial / k + (p - 1).factorial / (p - k) = p * ((p - 1).factorial / (k * (p - k)))", "i": "r3_wolstenholme_harmonic 的证明骨架中第 1 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "alg_card_eq_two_of_two_conj_classes", "k": "proved", "d": "代数", "s": "(G : Type*) [Group G] [Finite G] (h : Nat.card (ConjClasses G) = 2) : Nat.card G = 2", "i": "A finite group with exactly two conjugacy classes has order 2 — the classes are {1} and G \\ {1}, whose size |G| - 1 divides |G| by orbit-stabilizer, forcing |G| = 2.", "o": "conjecture", "c": 0, "r": ""}, {"n": "r3_wolstenholme_harmonic_s1h2", "k": "proved", "d": "数论", "s": ": ∀ (p : ℕ), Nat.Prime p → 5 ≤ p → ∑ k ∈ Finset.Icc 1 (p - 1), (p - 1).factorial / (p - k) = ∑ k ∈ Finset.Icc 1 (p - 1), (p - 1).factorial / k", "i": "r3_wolstenholme_harmonic 的证明骨架中第 2 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "lin_nilpotent_det_zero", "k": "proved", "d": "线性代数", "s": "(n k : ℕ) (A : Matrix (Fin (n + 1)) (Fin (n + 1)) ℝ) (h : A ^ k = 0) : Matrix.det A = 0", "i": "A nilpotent real matrix of positive size has determinant 0 — det(A)^k = det(A^k) = det 0 = 0 (size positive), and ℝ has no nilpotents.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_card_surjective_bool", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : Fintype.card {f : Fin n → Bool // Function.Surjective f} = 2 ^ n - 2", "i": "The number of surjections from an n-set onto a 2-set is 2^n - 2 (truncated subtraction covers n = 0) — a function to Bool is non-surjective iff it is one of the two constant functions (for n ≥ 1), count the complement.", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_cayley_hamilton_two", "k": "proved", "d": "线性代数", "s": "(R : Type) [CommRing R] (A : Matrix (Fin 2) (Fin 2) R) : A * A - Matrix.trace A • A + Matrix.det A • (1 : Matrix (Fin 2) (Fin 2) R) = 0", "i": "Cayley–Hamilton for 2×2 matrices over a commutative ring: A² − (tr A)A + (det A)I = 0 — entrywise check after expanding mul, trace and det on Fin 2, then ring.", "o": "conjecture", "c": 2, "r": ""}, {"n": "r3_wolstenholme_harmonic_s1h4", "k": "proved", "d": "数论", "s": ": ∀ (p : ℕ), Nat.Prime p → 5 ≤ p → ∑ k ∈ Finset.Icc 1 (p - 1), (↑k : ZMod p)⁻¹ ^ 2 = 0", "i": "r3_wolstenholme_harmonic 的证明骨架中第 4 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "lin_skew_odd_det_zero", "k": "proved", "d": "线性代数", "s": "(n : ℕ) (A : Matrix (Fin (2 * n + 1)) (Fin (2 * n + 1)) ℝ) (h : A.transpose = -A) : Matrix.det A = 0", "i": "A real skew-symmetric matrix of odd size is singular — det A = det Aᵀ = det(−A) = (−1)^(2n+1) det A = −det A, so 2 det A = 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_card_prime_of_subgroups_trivial", "k": "proved", "d": "代数", "s": "(G : Type*) [Group G] (h : ∀ H : Subgroup G, H = ⊥ ∨ H = ⊤) : Nat.card G = 1 ∨ (Nat.card G).Prime", "i": "A group whose only subgroups are ⊥ and ⊤ is trivial or (finite) of prime order — any g ≠ 1 generates G so G is cyclic; ℤ has proper subgroups so G is finite, and a cyclic group of composite order has a proper subgroup.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_sin_le_parabola", "k": "proved", "d": "分析", "s": "(x : ℝ) (h0 : 0 ≤ x) (h1 : x ≤ Real.pi) : Real.sin x ≤ 4 * x * (Real.pi - x) / Real.pi ^ 2", "i": "On [0,π] the sine lies below the parabola through (0,0), (π/2,1), (π,0) — by symmetry reduce to [0,π/2]; there h = parabola - sin has h(0)=h(π/2)=0, h'(π/2)=0 and h'' = sin x - 8/π^2 changes sign once, so h' is decreasing then increasing to 0, forcing h to rise then fall, hence h ≥ 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_card_surjective_fin_three", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : Fintype.card {f : Fin (n + 1) → Fin 3 // Function.Surjective f} + 3 * 2 ^ (n + 1) = 3 ^ (n + 1) + 3", "i": "The number of surjections from an m-set (m = n+1 ≥ 1) onto a 3-set is 3^m - 3·2^m + 3 — inclusion–exclusion over the set of missed values: functions missing value i number 2^m, missing two fixed values number 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "r3_sylvester_nonrepresentable_count_v2_s1h3", "k": "proved", "d": "数论", "s": ": ∀ (a b : ℕ), 0 < a → 0 < b → a.Coprime b → ∀ (M : ℕ) (P : ℕ → Prop) [inst : DecidablePred fun (n : ℕ) => ¬P n], (∀ n < M, P n ↔ ¬P (M - 1 - n)) → 2 * {n ∈ Finset.range M | ¬P n}.card = M", "i": "r3_sylvester_nonrepresentable_count_v2 的证明骨架中第 3 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "lin_two_by_two_order_three", "k": "proved", "d": "线性代数", "s": "(A : Matrix (Fin 2) (Fin 2) ℝ) (hd : Matrix.det A = 1) (ht : Matrix.trace A = -1) : A ^ 3 = 1", "i": "A real 2×2 matrix with determinant 1 and trace −1 satisfies A³ = I — by 2×2 Cayley–Hamilton A² + A + I = 0, then A³ − I = (A − I)(A² + A + I) = 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "r3_wolstenholme_harmonic_s1h3", "k": "proved", "d": "数论", "s": ": ∀ (p : ℕ), Nat.Prime p → 5 ≤ p → ∀ k ∈ Finset.Icc 1 (p - 1), (↑((p - 1).factorial / (k * (p - k))) : ZMod p) = (↑k : ZMod p)⁻¹ ^ 2", "i": "r3_wolstenholme_harmonic 的证明骨架中第 3 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "lin_commutator_sq_scalar", "k": "proved", "d": "线性代数", "s": "(R : Type) [CommRing R] (A B : Matrix (Fin 2) (Fin 2) R) : (A * B - B * A) * (A * B - B * A) = (-Matrix.det (A * B - B * A)) • (1 : Matrix (Fin 2) (Fin 2) R)", "i": "The square of a commutator of 2×2 matrices is the scalar matrix −det(AB−BA)·I — the commutator C has trace 0, so 2×2 Cayley–Hamilton gives C² = −(det C) I.", "o": "conjecture", "c": 0, "r": ""}, {"n": "r3_sylvester_nonrepresentable_count_v2_s1h1", "k": "proved", "d": "数论", "s": ": ∀ (a b : ℕ), 0 < a → 0 < b → a.Coprime b → ∀ n < (a - 1) * (b - 1), (∃ (x : ℕ) (y : ℕ), a * x + b * y = n) → ¬∃ (x : ℕ) (y : ℕ), a * x + b * y = (a - 1) * (b - 1) - 1 - n", "i": "r3_sylvester_nonrepresentable_count_v2 的证明骨架中第 1 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "r3_sylvester_nonrepresentable_count_v2_s1h2", "k": "proved", "d": "数论", "s": ": ∀ (a b : ℕ), 0 < a → 0 < b → a.Coprime b → ∀ n < (a - 1) * (b - 1), (¬∃ (x : ℕ) (y : ℕ), a * x + b * y = n) → ∃ (x : ℕ) (y : ℕ), a * x + b * y = (a - 1) * (b - 1) - 1 - n", "i": "r3_sylvester_nonrepresentable_count_v2 的证明骨架中第 2 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "r3_wolstenholme_harmonic", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (h5 : 5 ≤ p) : p ^ 2 ∣ ∑ k ∈ Finset.Icc 1 (p - 1), (p - 1).factorial / k", "i": "Wolstenholme's theorem: for a prime p ≥ 5 the numerator of H_{p-1} is divisible by p^2, stated as p^2 | (p-1)! * (1 + 1/2 + ... + 1/(p-1)) with exact natural-number divisions. Proof idea: pair k with p-k: 1/k + 1/(p-k) = p/(k(p-k)), so 2·S = p·Σ (p-1)!/(k(p-k)); modulo p the inner sum is -(p-1)!·Σ k^{-2} ≡ -(p-1)!·Σ_{j=1}^{p-1} j^2 = -(p-1)!·(p-1)p(2p-1)/6 ≡ 0 for p ≥ 5 (inversion permutes the uni", "o": "conjecture", "c": 0, "r": ""}, {"n": "r3_sylvester_nonrepresentable_count_v2", "k": "proved", "d": "数论", "s": "(a b : ℕ) (ha : 0 < a) (hb : 0 < b) (hab : Nat.Coprime a b) : ∃ S : Finset ℕ, (∀ n : ℕ, n ∈ S ↔ ¬ ∃ x y : ℕ, a * x + b * y = n) ∧ 2 * S.card = (a - 1) * (b - 1)", "i": "Sylvester's theorem (1884): for coprime positive a, b the set of natural numbers not of the form ax+by (x,y ≥ 0) is finite with exactly (a-1)(b-1)/2 elements. Mathlib has only the Frobenius number (frobeniusNumber_pair), not the count. Proof idea: every n has a unique representation n = ax+by with 0 ≤ x < b, y ∈ ℤ, and n is representable iff y ≥ 0; hence everything ≥ (a-1)(b-1) is representable, a", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_sum_mul_choose_sq", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : ∑ k ∈ Finset.range (n + 1), k * (n.choose k) ^ 2 = n * (2 * n - 1).choose (n - 1)", "i": "∑_k k·C(n,k)² = n·C(2n-1,n-1) — use k·C(n,k) = n·C(n-1,k-1) and C(n,k) = C(n,n-k), then Vandermonde (Nat.add_choose_eq) for ∑ C(n-1,k-1)·C(n,n-k) = C(2n-1,n-1).", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_symm_nilpotent_eq_zero", "k": "proved", "d": "线性代数", "s": "(n k : ℕ) (A : Matrix (Fin n) (Fin n) ℝ) (hs : A.IsSymm) (h : A ^ k = 0) : A = 0", "i": "A nilpotent real symmetric matrix is zero — for symmetric B, B² = BᵀB = 0 forces B = 0 (sum of squares of entries); apply repeatedly to A^(2^m) with 2^m ≥ k, noting powers of a symmetric matrix are symmetric.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_isunit_one_sub_mul_comm", "k": "proved", "d": "代数", "s": "(R : Type*) [Ring R] (a b : R) (h : IsUnit (1 - a * b)) : IsUnit (1 - b * a)", "i": "In any ring, if 1 - ab is a unit then so is 1 - ba — if c is the inverse of 1 - ab then 1 + b*c*a is a two-sided inverse of 1 - ba.", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_idempotent_join", "k": "proved", "d": "线性代数", "s": "(n : ℕ) (A B : Matrix (Fin n) (Fin n) ℝ) (hA : A * A = A) (hB : B * B = B) (hAB : A * B = B * A) : (A + B - A * B) * (A + B - A * B) = A + B - A * B", "i": "For commuting idempotent matrices A, B the join A + B − AB is idempotent — it equals I − (I − A)(I − B), a product of commuting idempotents; or expand and rewrite with the three hypotheses.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_perm_fin_center_eq_bot", "k": "proved", "d": "代数", "s": "(n : ℕ) (hn : 3 ≤ n) : Subgroup.center (Equiv.Perm (Fin n)) = ⊥", "i": "The center of the symmetric group S_n is trivial for n ≥ 3 — if σ i = j ≠ i pick k ∉ {i, j}; then σ does not commute with the transposition swap j k.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_x_pow_four_add_one_not_irreducible_zmod", "k": "proved", "d": "代数", "s": "(p : ℕ) [Fact p.Prime] : ¬ Irreducible (Polynomial.X ^ 4 + 1 : Polynomial (ZMod p))", "i": "X^4 + 1 is reducible modulo every prime — for p = 2 it is (X+1)^4; for odd p one of -1, 2, -2 is a square mod p (Legendre symbol multiplicativity), giving (X²+a)(X²-a), (X²+bX+1)(X²-bX+1) or (X²+cX-1)(X²-cX-1).", "o": "conjecture", "c": 1, "r": ""}, {"n": "comb_card_involutions_rec", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : Fintype.card {σ : Equiv.Perm (Fin (n + 2)) // σ * σ = 1} = Fintype.card {σ : Equiv.Perm (Fin (n + 1)) // σ * σ = 1} + (n + 1) * Fintype.card {σ : Equiv.Perm (Fin n) // σ * σ = 1}", "i": "The number a(n) of involutions (σ² = 1) in S_n satisfies a(n+2) = a(n+1) + (n+1)·a(n) — split on whether σ fixes the last point (restrict to Fin (n+1)) or swaps it with one of the n+1 others (remove both points, leaving an involution of an n-set).", "o": "conjecture", "c": 1, "r": ""}, {"n": "lin_gram_det_eq_zero_iff", "k": "proved", "d": "线性代数", "s": "(V : Type) [NormedAddCommGroup V] [InnerProductSpace ℝ V] (x y : V) : Matrix.det !![inner ℝ x x, inner ℝ x y; inner ℝ y x, inner ℝ y y] = 0 ↔ ¬ LinearIndependent ℝ ![x, y]", "i": "The Gram determinant of two vectors vanishes exactly when they are linearly dependent — the determinant is ‖x‖²‖y‖² − ⟨x,y⟩²; use the equality case of Cauchy–Schwarz (inner_mul_inner_self_le with equality iff one vector is a multiple of the other) and LinearIndependent.pair_iff.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_exists_block_sum_dvd", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) (hn : 0 < n) (a : ℕ → ℤ) : ∃ i j : ℕ, i < j ∧ j ≤ n ∧ (n : ℤ) ∣ ∑ k ∈ Finset.Ico i j, a k", "i": "Among any n integers a_0..a_{n-1} some nonempty consecutive block has sum divisible by n — the n+1 prefix sums S_0..S_n take two equal values mod n by pigeonhole; their difference is a block sum (Finset.sum_Ico_eq_sub).", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_card_range_sq_zmod_prime", "k": "proved", "d": "代数", "s": "(p : ℕ) [Fact p.Prime] (hp : p ≠ 2) : Nat.card (Set.range (fun x : ZMod p => x ^ 2)) = (p + 1) / 2", "i": "For an odd prime p there are exactly (p+1)/2 squares in ZMod p — the squaring map is 2-to-1 on nonzero elements (x² = y² iff x = ±y and x ≠ -x), plus 0.", "o": "conjecture", "c": 1, "r": ""}, {"n": "lin_idempotent_trace_eq_rank", "k": "proved", "d": "线性代数", "s": "(n : ℕ) (A : Matrix (Fin n) (Fin n) ℚ) (h : A * A = A) : Matrix.trace A = (Matrix.rank A : ℚ)", "i": "The trace of an idempotent rational matrix equals its rank — toLin' A is a projection onto its range (LinearMap.IsProj), so LinearMap.IsProj.trace gives trace = finrank(range) = rank; transfer between Matrix.trace and LinearMap.trace.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_sqrt_two_rec_lt_two", "k": "proved", "d": "分析", "s": "(a : ℕ → ℝ) (h0 : a 0 = 0) (hrec : ∀ n : ℕ, a (n + 1) = Real.sqrt (2 + a n)) (n : ℕ) : 0 ≤ a n ∧ a n < 2", "i": "The nested radical sequence a_0 = 0, a_{n+1} = sqrt(2 + a_n) stays in [0,2) — induction: if 0 ≤ a_n < 2 then 2 + a_n < 4 so sqrt(2 + a_n) < 2.", "o": "conjecture", "c": 5, "r": ""}, {"n": "comb_exists_two_dvd_sub", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) (hn : 0 < n) (f : Fin (n + 1) → ℤ) : ∃ i j : Fin (n + 1), i ≠ j ∧ (n : ℤ) ∣ f i - f j", "i": "Among n+1 integers two differ by a multiple of n — pigeonhole on residues: the map i ↦ (f i : ZMod n) from Fin (n+1) to ZMod n cannot be injective.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_ring_comm_of_pow_three_eq_self", "k": "proved", "d": "代数", "s": "(R : Type*) [Ring R] (h : ∀ x : R, x ^ 3 = x) : ∀ x y : R, x * y = y * x", "i": "A ring in which x³ = x for all x is commutative — show 6 = 0 and 3(x² + x) = 0, squares are central (via idempotents e = x² and (e y - e y e)² = 0 implies nilpotents vanish), then x = x³ - ... combine 3x(x+1) and 2-torsion parts to get commutativity.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_sqrt_two_rec_closed_form", "k": "proved", "d": "分析", "s": "(a : ℕ → ℝ) (h0 : a 0 = 0) (hrec : ∀ n : ℕ, a (n + 1) = Real.sqrt (2 + a n)) (n : ℕ) : a n = 2 * Real.cos (Real.pi / 2 ^ (n + 1))", "i": "Viète-type closed form: the nested radical sequence equals 2cos(π/2^(n+1)) — induction using the half-angle identity 2 + 2cos(2t) = 4cos^2 t and positivity of cos on (0, π/2].", "o": "conjecture", "c": 6, "r": ""}, {"n": "comb_catalan_succ_mul", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : (n + 2) * catalan (n + 1) = 2 * (2 * n + 1) * catalan n", "i": "First-order Catalan recurrence (n+2)·C_{n+1} = 2(2n+1)·C_n — from (n+1)·catalan n = centralBinom n and Nat.succ_mul_centralBinom_succ: (n+1)·centralBinom (n+1) = 2(2n+1)·centralBinom n.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_sqrt_two_rec_tendsto", "k": "proved", "d": "分析", "s": "(a : ℕ → ℝ) (h0 : a 0 = 0) (hrec : ∀ n : ℕ, a (n + 1) = Real.sqrt (2 + a n)) : Filter.Tendsto a Filter.atTop (nhds 2)", "i": "The nested radical sequence sqrt(2 + sqrt(2 + ...)) converges to 2 — show 0 ≤ a_n < 2 and the contraction 2 - a_{n+1} = (2 - a_n)/(2 + a_{n+1}) ≤ (2 - a_n)/2, so 0 ≤ 2 - a_n ≤ 2/2^n and squeeze.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_degree_add_degree_le_of_triangle_free", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (h : G.CliqueFree 3) (u v : V) (huv : G.Adj u v) : G.degree u + G.degree v ≤ Fintype.card V", "i": "In a triangle-free graph adjacent vertices u, v satisfy deg u + deg v ≤ n (the key step of Mantel's theorem) — the neighbour sets of u and v are disjoint, since a common neighbour w gives the 3-clique {u,v,w}.", "o": "conjecture", "c": 3, "r": ""}, {"n": "ana_tsum_inv_cube_le", "k": "proved", "d": "分析", "s": ": (∑' n : ℕ, 1 / (((n : ℝ) + 1) ^ 3)) ≤ 5 / 4", "i": "zeta(3) ≤ 5/4 — for n ≥ 3, 1/n^3 ≤ 1/((n-1)n(n+1)) = (1/2)(1/((n-1)n) - 1/(n(n+1))), which telescopes to 1/12; so every partial sum is ≤ 1 + 1/8 + 1/12 < 5/4, then use tsum_le_of_sum_le with summability from the p-series test.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_card_subset_pairs", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : ((Finset.univ : Finset (Finset (Fin n) × Finset (Fin n))).filter (fun p => p.1 ⊆ p.2)).card = 3 ^ n", "i": "The number of pairs A ⊆ B ⊆ [n] is 3^n — group by B: ∑_B 2^|B| = ∑_k C(n,k)2^k = 3^n; or biject with functions Fin n → Fin 3.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_one_add_inv_pow_mono", "k": "proved", "d": "分析", "s": "(n : ℕ) : (1 + 1 / (n : ℝ)) ^ n ≤ (1 + 1 / ((n : ℝ) + 1)) ^ (n + 1)", "i": "The sequence (1 + 1/n)^n is nondecreasing — AM-GM on n copies of (1 + 1/n) and one copy of 1, or equivalently Bernoulli's inequality applied to (1 - 1/(n+1)^2)^(n+1) ≥ 1 - 1/(n+1); n = 0 is trivial.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_fenchel_young_exp", "k": "proved", "d": "分析", "s": "(a b : ℝ) (hb : 0 < b) : a * b ≤ Real.exp a + b * Real.log b - b", "i": "Fenchel–Young inequality for the conjugate pair exp and b log b - b — apply 1 + t ≤ exp t with t = a - log b and multiply by b = exp(log b).", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_sylvester_rank", "k": "proved", "d": "线性代数", "s": "(n : ℕ) (A B : Matrix (Fin n) (Fin n) ℝ) : Matrix.rank A + Matrix.rank B ≤ n + Matrix.rank (A * B)", "i": "Sylvester's rank inequality: rank A + rank B ≤ n + rank(AB) — restrict A to range B: rank(AB) = rank B − dim(ker A ∩ range B) ≥ rank B − dim ker A, and dim ker A = n − rank A by rank–nullity.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_sum_card_fixed_points_perm", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) : ∑ σ : Equiv.Perm (Fin (n + 1)), (Finset.univ.filter (fun i : Fin (n + 1) => σ i = i)).card = (n + 1).factorial", "i": "The total number of fixed points over all permutations of an m-set (m ≥ 1) is m!, i.e. the average is 1 — double count pairs (σ, i) with σ i = i: for each i the stabiliser has (m-1)! elements; or Burnside for the transitive action of Perm on Fin m.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_sqrt_sub_sqrt_le_sqrt_abs", "k": "proved", "d": "分析", "s": "(x y : ℝ) (hx : 0 ≤ x) (hy : 0 ≤ y) : |Real.sqrt x - Real.sqrt y| ≤ Real.sqrt |x - y|", "i": "The square root is 1/2-Hölder with constant 1 — WLOG y ≤ x; then (sqrt x - sqrt y)^2 ≤ (sqrt x - sqrt y)(sqrt x + sqrt y) = x - y, and take square roots.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_isCyclic_of_card_eq_prime_mul_prime", "k": "proved", "d": "代数", "s": "(p q : ℕ) (hp : p.Prime) (hq : q.Prime) (hpq : p < q) (hndvd : ¬ p ∣ q - 1) (G : Type*) [Group G] (hG : Nat.card G = p * q) : IsCyclic G", "i": "A group of order pq with primes p < q and p ∤ q - 1 is cyclic — by Sylow's theorems both the Sylow p- and Sylow q-subgroup are unique hence normal, so G is their internal direct product C_p × C_q, which is cyclic since p, q are coprime.", "o": "conjecture", "c": 1, "r": ""}, {"n": "ana_continuous_additive_linear", "k": "proved", "d": "分析", "s": "(f : ℝ → ℝ) (hf : Continuous f) (hadd : ∀ x y : ℝ, f (x + y) = f x + f y) (x : ℝ) : f x = f 1 * x", "i": "Cauchy's functional equation: a continuous additive function on ℝ is linear — additivity gives f(q) = q f(1) for rational q, and both sides are continuous so they agree on the closure of ℚ (or package f as a continuous AddMonoidHom and use map_real_smul).", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_card_edgeFinset_le_of_coloring_bool", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (C : G.Coloring Bool) : 4 * G.edgeFinset.card ≤ Fintype.card V ^ 2", "i": "A bipartite (2-colourable) graph on n vertices has at most n²/4 edges — edges inject into (colour class true) × (colour class false), of size a·(n-a), and 4a(n-a) ≤ n².", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_nilpotent_det_one_add", "k": "proved", "d": "线性代数", "s": "(n k : ℕ) (A : Matrix (Fin n) (Fin n) ℝ) (h : A ^ k = 0) : Matrix.det (1 + A) = 1", "i": "For a nilpotent real matrix A, det(I + A) = 1 — the characteristic polynomial of a nilpotent matrix over a domain is X^n; evaluate det(tI − A) at t = −1 (and fix signs), or show det(I + tA) is a polynomial unit in t hence constant.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_compl_connected_of_not_connected", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Nonempty V] (G : SimpleGraph V) (h : ¬ G.Connected) : Gᶜ.Connected", "i": "The complement of a disconnected graph is connected — pick a, b not G-reachable; for any x, y: if not G-reachable from each other they are adjacent in the complement, otherwise one of a, b is G-unreachable from both and is a common complement-neighbour.", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_idempotent_rank_complement", "k": "proved", "d": "线性代数", "s": "(n : ℕ) (A : Matrix (Fin n) (Fin n) ℝ) (h : A * A = A) : Matrix.rank A + Matrix.rank (1 - A) = n", "i": "For an idempotent matrix, rank A + rank(I − A) = n — ≤ from A(I − A) = 0 (Matrix.rank_add_rank_le_card_of_mul_eq_zero), ≥ from subadditivity of rank applied to A + (I − A) = I.", "o": "conjecture", "c": 0, "r": ""}, {"n": "lin_nilpotent_pow_card", "k": "proved", "d": "线性代数", "s": "(n k : ℕ) (A : Matrix (Fin n) (Fin n) ℝ) (h : A ^ k = 0) : A ^ n = 0", "i": "A nilpotent n×n real matrix satisfies Aⁿ = 0 — its characteristic polynomial is Xⁿ (nilpotent over a domain), then Cayley–Hamilton (Matrix.aeval_self_charpoly).", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_not_acyclic_of_two_le_degree", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] [Nonempty V] (G : SimpleGraph V) [DecidableRel G.Adj] (h : ∀ v : V, 2 ≤ G.degree v) : ¬ G.IsAcyclic", "i": "A nonempty finite graph with minimum degree ≥ 2 contains a cycle — take a longest path; its end vertex has a second neighbour which must lie on the path, closing a cycle. Alternatively count: an acyclic graph has fewer than n edges while the handshake lemma gives ≥ n.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_card_sq_eq_one_zmod_two_pow", "k": "proved", "d": "代数", "s": "(k : ℕ) (hk : 3 ≤ k) : Nat.card {x : ZMod (2 ^ k) // x ^ 2 = 1} = 4", "i": "For k ≥ 3 the congruence x² = 1 mod 2^k has exactly four solutions (±1 and 2^(k-1) ± 1) — 2^k | (x-1)(x+1) with gcd(x-1, x+1) = 2 forces 2^(k-1) | x - 1 or 2^(k-1) | x + 1.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_monotone_additive_linear", "k": "proved", "d": "分析", "s": "(f : ℝ → ℝ) (hf : Monotone f) (hadd : ∀ x y : ℝ, f (x + y) = f x + f y) (x : ℝ) : f x = f 1 * x", "i": "A monotone additive function on ℝ is linear — f(q) = q f(1) on rationals; for real x squeeze between rationals p < x < q: p f(1) ≤ f(x) ≤ q f(1) (f(1) ≥ 0 by monotonicity), and let p, q → x.", "o": "conjecture", "c": 0, "r": ""}, {"n": "ana_convex_bddAbove_const", "k": "proved", "d": "分析", "s": "(f : ℝ → ℝ) (hf : ConvexOn ℝ Set.univ f) (M : ℝ) (hM : ∀ x : ℝ, f x ≤ M) (x y : ℝ) : f x = f y", "i": "A convex function on ℝ that is bounded above is constant — if f x < f y, write y as a convex combination of x and the far point z_t = x + t(y - x), t > 1: f y ≤ (1 - 1/t) f x + (1/t) f z_t gives f z_t ≥ f x + t (f y - f x) → ∞, contradicting the bound; symmetric for f y < f x.", "o": "conjecture", "c": 1, "r": ""}, {"n": "comb_colorable_of_degree_le", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (d : ℕ) (h : ∀ v : V, G.degree v ≤ d) : G.Colorable (d + 1)", "i": "Greedy bound χ(G) ≤ Δ(G) + 1 — induction on the number of vertices: remove a vertex, colour the rest with d+1 colours, and give the removed vertex a colour not used on its ≤ d neighbours.", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_card_le_two_of_mulAut_trivial", "k": "proved", "d": "代数", "s": "(G : Type*) [Group G] [Finite G] (h : ∀ f : MulAut G, f = 1) : Nat.card G ≤ 2", "i": "A finite group with trivial automorphism group has at most 2 elements — inner automorphisms trivial gives G abelian; inversion trivial gives exponent 2; so G is an F_2-vector space, and if its dimension is ≥ 2 swapping two basis vectors is a nontrivial automorphism.", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_tournament_hamiltonian_path", "k": "proved", "d": "组合与图论", "s": "(n : ℕ) (r : Fin n → Fin n → Prop) (h : ∀ i j : Fin n, i ≠ j → r i j ∨ r j i) : ∃ σ : Equiv.Perm (Fin n), ∀ (i : Fin n) (hi : i.val + 1 < n), r (σ i) (σ ⟨i.val + 1, hi⟩)", "i": "Rédei: every tournament (indeed every semicomplete digraph) on n vertices has a directed Hamiltonian path — induction on n: given a path through the first n vertices, insert the new vertex v before the first path vertex that v beats (or at the end if none).", "o": "conjecture", "c": 0, "r": ""}, {"n": "comb_exists_cut_half_edges", "k": "proved", "d": "组合与图论", "s": "(V : Type) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] : ∃ s : Finset V, G.edgeFinset.card ≤ 2 * ((s ×ˢ sᶜ).filter (fun p : V × V => G.Adj p.1 p.2)).card", "i": "Every finite graph has a cut containing at least half of its edges — take s maximising the cut size: every vertex then has at least half of its neighbours on the other side (else moving it increases the cut); sum over vertices. Or average over all 2^n subsets.", "o": "conjecture", "c": 1, "r": ""}, {"n": "gen_lin_idempotent_trace_eq_rank_field", "k": "proved", "d": "线性代数", "s": "(K : Type*) [Field K] (ι : Type*) [Fintype ι] [DecidableEq ι] (A : Matrix ι ι K) (h : A * A = A) : Matrix.trace A = (Matrix.rank A : K)", "i": "Generalizes Mathlib2.lin_idempotent_trace_eq_rank: ℚ → arbitrary field K (any characteristic; the rank is cast into K), Fin n → arbitrary Fintype. Also subsumes lin_idempotent_rank_complement_aux1 (the ℝ copy). Proof idea: the original proof is field-agnostic: toLin' A is idempotent, LinearMap.IsIdempotentElem.isProj_range + LinearMap.IsProj.trace + Matrix.trace_toLin'_eq.", "o": "conjecture", "c": 4, "r": ""}, {"n": "gen_lin_idempotent_rank_complement_field", "k": "proved", "d": "线性代数", "s": "(K : Type*) [Field K] (ι : Type*) [Fintype ι] [DecidableEq ι] (A : Matrix ι ι K) (h : A * A = A) : Matrix.rank A + Matrix.rank (1 - A) = Fintype.card ι", "i": "Generalizes Mathlib2.lin_idempotent_rank_complement: ℝ → arbitrary field K, Fin n → arbitrary Fintype. Proof idea: avoid the trace argument (fails to conclude in positive characteristic); instead range(1-A) = ker A for idempotent A and rank-nullity, or Sylvester (A(1-A)=0 gives ≤) plus rank subadditivity for A + (1-A) = 1 (gives ≥).", "o": "conjecture", "c": 2, "r": ""}, {"n": "alg_perm_eq_mul_two_involutions_s1h1", "k": "proved", "d": "代数", "s": ": ∀ (n : ℕ) (τ : Equiv.Perm (Fin n)), τ.IsCycle → ∃ (a : Equiv.Perm (Fin n)), a * a = 1 ∧ a * τ * a = τ⁻¹ ∧ ∀ (x : Fin n), (τ : Fin n → Fin n) x = x → (a : Fin n → Fin n) x = x", "i": "alg_perm_eq_mul_two_involutions 的证明骨架中第 1 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "gen_lin_sylvester_rank_rect", "k": "proved", "d": "线性代数", "s": "(K : Type*) [Field K] (m n p : Type*) [Fintype m] [Fintype n] [Fintype p] (A : Matrix m n K) (B : Matrix n p K) : Matrix.rank A + Matrix.rank B ≤ Fintype.card n + Matrix.rank (A * B)", "i": "Generalizes Mathlib2.lin_sylvester_rank: ℝ → arbitrary field K, square Fin n matrices → rectangular matrices A : m×n, B : n×p over arbitrary Fintypes. Proof idea: the original proof (rank-nullity for A.mulVecLin and for its restriction to range B.mulVecLin) never uses ℝ or squareness.", "o": "conjecture", "c": 3, "r": ""}, {"n": "alg_perm_eq_mul_two_involutions_s2h2", "k": "proved", "d": "代数", "s": ": ∀ (n : ℕ) (τ ρ : Equiv.Perm (Fin n)), τ.Disjoint ρ → (∃ (a : Equiv.Perm (Fin n)), a * a = 1 ∧ a * τ * a = τ⁻¹ ∧ ∀ (x : Fin n), (τ : Fin n → Fin n) x = x → (a : Fin n → Fin n) x = x) → (∃ (a : Equiv.Perm (Fin n)), a * a = 1 ∧ a * ρ * a = ρ⁻¹ ∧ ∀ (x : Fin n), (ρ : Fin n → Fin n) x = x → (a : Fin n → Fin n) x = x) → ∃ (a : Equiv.Perm (Fin n)), a * a = 1 ∧ a * (τ * ρ) * a = (τ * ρ)⁻¹ ∧ ∀ (x : Fin n), (τ : Fin n → Fin n) ((ρ : Fin n → Fin n) x) = x → (a : Fin n → Fin n) x = x", "i": "alg_perm_eq_mul_two_involutions 的证明骨架中第 2 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "alg_perm_eq_mul_two_involutions", "k": "proved", "d": "代数", "s": "(n : ℕ) (σ : Equiv.Perm (Fin n)) : ∃ a b : Equiv.Perm (Fin n), a * a = 1 ∧ b * b = 1 ∧ σ = a * b", "i": "Every permutation of a finite set is a product of two involutions — on each cycle (x, σx, …, σ^{m-1}x) define a as the reflection σ^i x ↦ σ^{-i} x; then a is an involution and a σ a = σ⁻¹, so b = a σ satisfies b² = 1 and σ = a b.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_nt_sq_add_sq_eq_prime_mul_sq", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (hp3 : p % 4 = 3) (x y z : ℤ) (h : x ^ 2 + y ^ 2 = (p : ℤ) * z ^ 2) : x = 0 ∧ y = 0 ∧ z = 0", "i": "Generalizes Mathlib2.nt2_sq_add_sq_eq_seven_mul_sq: 7 → every prime p ≡ 3 (mod 4). Proof idea: infinite descent on |z| (or on x²+y²) using Mathlib2.nt2_prime_three_mod_four_dvd_sq_add_sq: p ∣ x, p ∣ y, hence p ∣ z², p ∣ z, and (x/p, y/p, z/p) is a smaller solution.", "o": "conjecture", "c": 1, "r": ""}, {"n": "gen_lin_nilpotent_pow_card_reduced", "k": "proved", "d": "线性代数", "s": "(R : Type*) [CommRing R] [IsReduced R] (ι : Type*) [Fintype ι] [DecidableEq ι] (A : Matrix ι ι R) (h : IsNilpotent A) : A ^ Fintype.card ι = 0", "i": "Generalizes Mathlib2.lin_nilpotent_pow_card: ℝ → any reduced commutative ring (false for non-reduced rings: the 1×1 matrix [ε], ε²=0), Fin n → Fintype. Proof idea: Matrix.isNilpotent_charpoly_sub_pow_of_isNilpotent gives charpoly − X^card nilpotent in R[X], which is reduced, so charpoly = X^card; then Cayley–Hamilton (Matrix.aeval_self_charpoly).", "o": "conjecture", "c": 2, "r": ""}, {"n": "gen_nt_sq_sub_add_one_dvd_pow_sum", "k": "proved", "d": "数论", "s": "(R : Type*) [CommRing R] (a : R) (n : ℕ) : (a ^ 2 - a + 1) ∣ a ^ (2 * n + 1) + (a - 1) ^ (n + 2)", "i": "Generalizes Mathlib2.nt_seven_dvd_pow_sum: the constants 3, 2, 7 → a, a−1, a²−a+1 for an arbitrary element a of an arbitrary commutative ring (a = 3 in ℤ gives the original). Proof idea: modulo a²−a+1 one has a² ≡ a−1 and (a−1)² ≡ −a, so a^(2n+1) ≡ a(a−1)^n and (a−1)^(n+2) ≡ −a(a−1)^n; formally induct on n with step a^(2n+3)+(a−1)^(n+3) = (a−1)(a^(2n+1)+(a−1)^(n+2)) + (a²−a+1)·a^(2n+1).", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_lin_nilpotent_det_one_add_reduced", "k": "proved", "d": "线性代数", "s": "(R : Type*) [CommRing R] [IsReduced R] (ι : Type*) [Fintype ι] [DecidableEq ι] (A : Matrix ι ι R) (h : IsNilpotent A) : Matrix.det (1 + A) = 1", "i": "Generalizes Mathlib2.lin_nilpotent_det_one_add: ℝ → any reduced commutative ring (false in non-reduced rings: det(1+[ε]) = 1+ε), Fin n → Fintype. Proof idea: charpoly(−A) = X^card as for nilpotent matrices over a reduced ring; evaluate at 1: det(1·1 − (−A)) = 1.", "o": "conjecture", "c": 2, "r": ""}, {"n": "gen_comb_erdos_szekeres_linear_order", "k": "proved", "d": "组合与图论", "s": "(α : Type*) [LinearOrder α] (ι : Type*) [LinearOrder ι] [Fintype ι] (r s : ℕ) (hcard : r * s < Fintype.card ι) (f : ι → α) (hf : Function.Injective f) : (∃ t : Finset ι, r < t.card ∧ StrictMonoOn f ↑t) ∨ (∃ t : Finset ι, s < t.card ∧ StrictAntiOn f ↑t)", "i": "Generalizes Mathlib2.r3_erdos_szekeres: codomain ℝ → any linear order α; domain Fin (r*s+1) → any finite linear order with more than r*s elements. Proof idea: the original pigeonhole proof on (longest increasing, longest decreasing) labels uses only the order; alternatively transport along the order isomorphism ι ≃o Fin (card ι) and restrict to the first r*s+1 elements.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_lin_symm_nilpotent_eq_zero_ordered", "k": "proved", "d": "线性代数", "s": "(R : Type*) [CommRing R] [LinearOrder R] [IsStrictOrderedRing R] (ι : Type*) [Fintype ι] [DecidableEq ι] (A : Matrix ι ι R) (hs : A.IsSymm) (h : IsNilpotent A) : A = 0", "i": "Generalizes Mathlib2.lin_symm_nilpotent_eq_zero: ℝ → any linearly ordered commutative ring, Fin n → Fintype. Proof idea: same induction on the exponent; the key step B symmetric, B*B = 0 ⇒ B = 0 holds because the diagonal of Bᵀ*B is a sum of squares, which vanishes only if all terms vanish in an ordered ring.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_lin_commutator_ne_one_card", "k": "proved", "d": "线性代数", "s": "(R : Type*) [CommRing R] (ι : Type*) [Fintype ι] [DecidableEq ι] (A B : Matrix ι ι R) (hc : (Fintype.card ι : R) ≠ 0) : A * B - B * A ≠ 1", "i": "Generalizes Mathlib2.lin_commutator_ne_one: ℝ → any commutative ring in which the size of the matrix is nonzero (covers every characteristic-0 field, and char p with p ∤ n; false when char divides n), Fin (n+1) → Fintype. Proof idea: trace(AB − BA) = 0 but trace 1 = card ι.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_an_schur_nat_pow_ordered_ring", "k": "proved", "d": "代数", "s": "(R : Type*) [CommRing R] [LinearOrder R] [IsStrictOrderedRing R] (a b c : R) (ha : 0 ≤ a) (hb : 0 ≤ b) (hc : 0 ≤ c) (t : ℕ) : 0 ≤ a ^ t * (a - b) * (a - c) + b ^ t * (b - a) * (b - c) + c ^ t * (c - a) * (c - b)", "i": "Generalizes Mathlib2.an_schur_deg_one: ℝ → any linearly ordered commutative ring, and exponent 1 → arbitrary natural exponent t (Schur's inequality; t = 1 is the original). Proof idea: WLOG a ≥ b ≥ c; then a^t(a−b)(a−c) + b^t(b−a)(b−c) = (a−b)(a^t(a−c) − b^t(b−c)) ≥ 0 by monotonicity of x^t on nonnegatives, and the c-term is ≥ 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_lin_skew_odd_two_mul_det", "k": "proved", "d": "线性代数", "s": "(R : Type*) [CommRing R] (ι : Type*) [Fintype ι] [DecidableEq ι] (A : Matrix ι ι R) (hodd : Odd (Fintype.card ι)) (h : A.transpose = -A) : 2 * A.det = 0", "i": "Generalizes Mathlib2.lin_skew_odd_det_zero: ℝ → any commutative ring, with conclusion 2·det A = 0 (det A = 0 follows whenever 2 is regular; the plain conclusion is false in characteristic 2, e.g. A = 1), Fin (2n+1) → Fintype of odd cardinality. Proof idea: det A = det Aᵀ = det(−A) = (−1)^card det A = −det A.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_an_chebyshev_index_weighted_ordered_ring", "k": "proved", "d": "代数", "s": "(R : Type*) [CommRing R] [LinearOrder R] [IsStrictOrderedRing R] (a : ℕ → R) (ha : Monotone a) (n : ℕ) : ((n : R) - 1) * ∑ i ∈ Finset.range n, a i ≤ 2 * ∑ i ∈ Finset.range n, (i : R) * a i", "i": "Generalizes Mathlib2.an2_chebyshev_index_weighted: ℝ → any linearly ordered commutative ring. Proof idea: induction on n, or Chebyshev sum inequality (MonovaryOn.sum_mul_sum_le_card_mul_sum) for the monotone pair (i, a i); no division is used.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_lin_eigenvalue_root_of_aeval_eq_zero", "k": "proved", "d": "多项式", "s": "(R : Type*) [CommRing R] (V : Type*) [AddCommGroup V] [Module R V] [NoZeroSMulDivisors R V] (f : Module.End R V) (p : Polynomial R) (hp : Polynomial.aeval f p = 0) (μ : R) (hμ : f.HasEigenvalue μ) : p.IsRoot μ", "i": "Generalizes Mathlib2.lin_involution_eigenvalue: ℝ → any commutative ring R acting without zero-smul-divisors (e.g. any field), and the relation f*f = 1 → an arbitrary polynomial relation p(f) = 0: every eigenvalue is a root of p (the original is p = X²−1). Proof idea: for an eigenvector v, p(f) v = p(μ) • v (Module.End.aeval_apply_of_hasEigenvector), so p(μ) • v = 0 with v ≠ 0.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_an_nesbitt_finset_ordered_field", "k": "proved", "d": "代数", "s": "(K : Type*) [Field K] [LinearOrder K] [IsStrictOrderedRing K] (ι : Type*) (s : Finset ι) (a : ι → K) (ha : ∀ i ∈ s, 0 < a i) (hs : 2 ≤ s.card) : (s.card : K) / ((s.card : K) - 1) ≤ ∑ i ∈ s, a i / (∑ j ∈ s, a j - a i)", "i": "Generalizes Mathlib2.an2_nesbitt_general: ℝ → any linearly ordered field, range (n+2) → arbitrary Finset with at least 2 elements. Also implies an_nesbitt. Proof idea: with S = ∑ a, write a i/(S − a i) = S/(S − a i) − 1 and apply Cauchy–Schwarz / Sedrakyan (Finset.sum_div_pow_le or div_add_div_same style lemmas valid in ordered fields) to ∑ 1/(S − a i) with ∑ (S − a i) = (card − 1) S.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_an_hardy_finite_ordered_field", "k": "proved", "d": "分析", "s": "(K : Type*) [Field K] [LinearOrder K] [IsStrictOrderedRing K] (a : ℕ → K) (n : ℕ) : ∑ k ∈ Finset.range n, ((∑ i ∈ Finset.range (k + 1), a i) / ((k : K) + 1)) ^ 2 ≤ 4 * ∑ k ∈ Finset.range n, a k ^ 2", "i": "Generalizes Mathlib2.r3_hardy_inequality_finite: ℝ → any linearly ordered field (no sign hypothesis, as in the original). Proof idea: the original proof is purely algebraic (telescoping bound A_k² − 2 a_k A_k ≤ ... then T ≤ 2Q, Q² ≤ T·B ⇒ T ≤ 4B, which is square-root free); redo the sub-lemmas with K in place of ℝ, using Finset.sum_mul_sq_le_sq_mul_sq for Cauchy–Schwarz.", "o": "conjecture", "c": 0, "r": ""}, {"n": "gen_an_amgm_finset_ordered_ring", "k": "proved", "d": "代数", "s": "(R : Type*) [CommRing R] [LinearOrder R] [IsStrictOrderedRing R] (ι : Type*) (s : Finset ι) (a : ι → R) (ha : ∀ i ∈ s, 0 ≤ a i) : (s.card : R) ^ s.card * ∏ i ∈ s, a i ≤ (∑ i ∈ s, a i) ^ s.card", "i": "Generalizes Mathlib2.an2_amgm_range_pow: ℝ → any linearly ordered commutative ring via a division-free form card^card · ∏ a ≤ (∑ a)^card, range (n+1) → arbitrary Finset. Also implies an_amgm_three_cube. Proof idea: no n-th roots available, so induct on the finset (e.g. Cauchy forward–backward induction, or the smoothing step replacing min and max by mean-preserving pair).", "o": "conjecture", "c": 5, "r": ""}, {"n": "gen_an_perm_div_sum_ge_card", "k": "proved", "d": "组合与图论", "s": "(K : Type*) [Field K] [LinearOrder K] [IsStrictOrderedRing K] (ι : Type*) [Fintype ι] (σ : Equiv.Perm ι) (x : ι → K) (hx : ∀ i, 0 < x i) : (Fintype.card ι : K) ≤ ∑ i, x i / x (σ i)", "i": "Generalizes Mathlib2.an2_cyclic_div_ge_card: ℝ → any linearly ordered field, cyclic shift on range → an arbitrary permutation σ of an arbitrary Fintype: card ι ≤ ∑ x i / x (σ i). Also implies an_cyclic_div_ge_three. Proof idea: the ratios y i = x i / x (σ i) are positive with product 1 (Equiv.prod_comp); prove ∑ y ≥ card for positive y with ∏ y = 1 by induction (merge a term ≤ 1 with a term ≥ 1 us", "o": "conjecture", "c": 0, "r": ""}, {"n": "alg_artin_schreier_irreducible_zmod_s1h2", "k": "proved", "d": "代数", "s": ": ∀ (p : ℕ) [inst : Fact (Nat.Prime p)] (g : Polynomial (ZMod p)), Irreducible g → AdjoinRoot.root g ^ p ^ g.natDegree = AdjoinRoot.root g", "i": "alg_artin_schreier_irreducible_zmod 的证明骨架中第 2 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "alg_artin_schreier_irreducible_zmod_s1h3", "k": "proved", "d": "代数", "s": ": ∀ (p : ℕ) [inst : Fact (Nat.Prime p)] (g : Polynomial (ZMod p)), Irreducible g → CharP (AdjoinRoot g) p", "i": "alg_artin_schreier_irreducible_zmod 的证明骨架中第 3 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "alg_artin_schreier_irreducible_zmod_s1h4", "k": "proved", "d": "代数", "s": ": ∀ (p : ℕ) [inst : Fact (Nat.Prime p)] (f : Polynomial (ZMod p)), f = Polynomial.X ^ p - Polynomial.X - 1 → f.natDegree = p", "i": "alg_artin_schreier_irreducible_zmod 的证明骨架中第 4 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "alg_artin_schreier_irreducible_zmod_s1h1", "k": "proved", "d": "代数", "s": ": ∀ (p : ℕ) [Fact (Nat.Prime p)] (K : Type) [inst : CommRing K] [CharP K p] (α : K), α ^ p = α + 1 → ∀ (k : ℕ), α ^ p ^ k = α + (↑k : K)", "i": "alg_artin_schreier_irreducible_zmod 的证明骨架中第 1 个空洞", "o": "decomposition", "c": 1, "r": ""}, {"n": "alg_artin_schreier_irreducible_zmod", "k": "proved", "d": "代数", "s": "(p : ℕ) [Fact p.Prime] : Irreducible (Polynomial.X ^ p - Polynomial.X - 1 : Polynomial (ZMod p))", "i": "The Artin–Schreier polynomial X^p - X - 1 is irreducible over ZMod p — if α is a root in an extension then the roots are α + i (i ∈ F_p), so all irreducible factors have the same degree d with d ∣ p; d = 1 is impossible since a^p - a - 1 = -1 ≠ 0 for a ∈ F_p.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_unit_one_add_div_conj", "k": "proved", "d": "几何与拓扑", "s": "(z : ℂ) (hz : ‖z‖ = 1) (h : z ≠ -1) : (1 + z) / (1 + (starRingEnd ℂ) z) = z", "i": "For z on the unit circle with z ≠ -1, (1+z)/(1+conj z) = z — conj z = z⁻¹ since z * conj z = ‖z‖² = 1, then clear denominators.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_median_length", "k": "proved", "d": "几何与拓扑", "s": "{V : Type*} [NormedAddCommGroup V] [InnerProductSpace ℝ V] (a b c : V) : ‖a - (1 / 2 : ℝ) • (b + c)‖ ^ 2 = (2 * ‖a - b‖ ^ 2 + 2 * ‖a - c‖ ^ 2 - ‖b - c‖ ^ 2) / 4", "i": "Apollonius' median length formula: the squared distance from a to the midpoint of b and c is (2|ab|² + 2|ac|² − |bc|²)/4 — expand all squared norms into inner products (or apply the parallelogram law to a−b and a−c).", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_tan_pi_div_eight", "k": "proved", "d": "几何与拓扑", "s": ": Real.tan (Real.pi / 8) = Real.sqrt 2 - 1", "i": "tan(π/8) = √2 − 1 — use tan = sin/cos with Mathlib's closed forms for sin(π/8), cos(π/8), or tan(x/2) = (1 − cos x)/sin x at x = π/4.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_prod_sin_pi_mul_div", "k": "proved", "d": "几何与拓扑", "s": "(n : ℕ) : ∏ k ∈ Finset.range n, Real.sin (((k : ℝ) + 1) * Real.pi / ((n : ℝ) + 1)) = ((n : ℝ) + 1) / 2 ^ n", "i": "∏_{k=1}^{m−1} sin(kπ/m) = m / 2^{m−1} (with m = n+1) — from ∏_{k=1}^{m−1}(1 − ζ^k) = m for ζ = exp(2πi/m) (IsPrimitiveRoot.prod_one_sub_pow_eq_order), take norms and use |1 − e^{2iθ}| = 2 sin θ for θ ∈ [0, π].", "o": "conjecture", "c": 1, "r": ""}, {"n": "p3_aux_fib_prime", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (h2 : p ≠ 2) : (2 * Nat.fib (p + 1) : ℤ) - Nat.fib p ≡ 1 [ZMOD p] ∧ (Nat.fib p : ℤ) ≡ 5 ^ (p / 2) [ZMOD p]", "i": "auxiliary (used in proofs of Thm 1 and Thm 2): L_p = 1 and F_p = 5^((p-1)/2) mod p for odd primes p", "o": "conjecture", "c": 5, "r": "unsure"}, {"n": "top_frontier_frontier_frontier", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [TopologicalSpace X] (A : Set X) : frontier (frontier (frontier A)) = frontier (frontier A)", "i": "The frontier operator is idempotent from the second application on — frontier A is closed, so frontier (frontier A) = frontier A \\ interior (frontier A) is closed with empty interior (interior_frontier), and a closed set with empty interior is its own frontier.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_sin_pi_div_ten", "k": "proved", "d": "几何与拓扑", "s": ": Real.sin (Real.pi / 10) = (Real.sqrt 5 - 1) / 4", "i": "sin(π/10) = (√5 − 1)/4 — sin(π/10) = cos(2π/5) = 2cos²(π/5) − 1 and Mathlib's cos(π/5) = (1+√5)/4.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_disjoint_interior_closure_of_open", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [TopologicalSpace X] (U V : Set X) (hU : IsOpen U) (hV : IsOpen V) (hd : Disjoint U V) : Disjoint (interior (closure U)) (interior (closure V))", "i": "Disjoint open sets have disjoint regularizations — an open set disjoint from V is disjoint from closure V; apply this twice (Disjoint.closure_left/right for open sets) and shrink to interiors.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_cos_pi_div_five_sub_cos_two_pi_div_five", "k": "proved", "d": "几何与拓扑", "s": ": Real.cos (Real.pi / 5) - Real.cos (2 * Real.pi / 5) = 1 / 2", "i": "cos 36° − cos 72° = 1/2 — double angle formula plus cos(π/5) = (1+√5)/4, or the quadratic 4c² − 2c − 1 = 0 satisfied by c = cos(π/5).", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_equilateral_iff_sum_sq", "k": "proved", "d": "几何与拓扑", "s": "(a b c : ℂ) : (‖a - b‖ = ‖b - c‖ ∧ ‖b - c‖ = ‖c - a‖) ↔ a ^ 2 + b ^ 2 + c ^ 2 = a * b + b * c + c * a", "i": "A triangle abc in the complex plane is equilateral (possibly degenerate to a point) iff a² + b² + c² = ab + bc + ca — the difference factors as (a + ωb + ω²c)(a + ω²b + ωc) with ω a primitive cube root of unity; a + ωb + ω²c = 0 says c − a is b − a rotated by 60°, and conversely equal side lengths force (c−a)/(b−a) to be a primitive 6th root of unity.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_closure_open_inter_closure", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [TopologicalSpace X] (U A : Set X) (hU : IsOpen U) : closure (U ∩ closure A) = closure (U ∩ A)", "i": "For open U, closure (U ∩ closure A) = closure (U ∩ A) — one inclusion is monotonicity, the other is IsOpen.inter_closure followed by closure_minimal.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_perp_bisector_iff", "k": "proved", "d": "几何与拓扑", "s": "{V : Type*} [NormedAddCommGroup V] [InnerProductSpace ℝ V] (a b p : V) : ‖p - a‖ = ‖p - b‖ ↔ inner ℝ (p - (1 / 2 : ℝ) • (a + b)) (b - a) = 0", "i": "p is equidistant from a and b iff p − midpoint(a,b) is orthogonal to b − a — ‖p−a‖² − ‖p−b‖² = 2⟨p − (a+b)/2, b − a⟩, and norms are nonnegative.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_dist_div_one_add_triangle", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] (x y z : X) : dist x z / (1 + dist x z) ≤ dist x y / (1 + dist x y) + dist y z / (1 + dist y z)", "i": "The bounded metric d/(1+d) satisfies the triangle inequality — t ↦ t/(1+t) is monotone and subadditive on [0,∞); combine with dist_triangle.", "o": "conjecture", "c": 0, "r": ""}, {"n": "p3_thm1_disproof", "k": "disproved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (h5 : 5 < p) : ((p % 5 = 1 ∨ p % 5 = 4) → (p3_fibsum p : ℤ) ≡ 3 [ZMOD p]) ∧ ((p % 5 = 2 ∨ p % 5 = 3) → (p3_fibsum p : ℤ) ≡ 1 [ZMOD p])", "i": "Theorem 1 as literally written: S_p = 3 mod p if p = 1,4 mod 5 and S_p = 1 mod p if p = 2,3 mod 5", "o": "paper", "c": 0, "r": "faithful"}, {"n": "geo_sin_mul_sin_pi_div_three_sub_add", "k": "proved", "d": "几何与拓扑", "s": "(x : ℝ) : Real.sin x * Real.sin (Real.pi / 3 - x) * Real.sin (Real.pi / 3 + x) = Real.sin (3 * x) / 4", "i": "sin x · sin(π/3 − x) · sin(π/3 + x) = sin(3x)/4 — expand with addition formulas (sin(π/3)=√3/2, cos(π/3)=1/2) to get sin x (3/4 cos²x − 1/4 sin²x), then use the triple angle formula.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_cos_sum_two_pi_div_seven", "k": "proved", "d": "几何与拓扑", "s": ": Real.cos (2 * Real.pi / 7) + Real.cos (4 * Real.pi / 7) + Real.cos (6 * Real.pi / 7) = -1 / 2", "i": "cos(2π/7) + cos(4π/7) + cos(6π/7) = −1/2 — multiply by 2 sin(π/7) ≠ 0 and telescope with 2 sin x cos y = sin(x+y) − sin(y−x), leaving sin(π) − sin(π/7); or take real parts of the sum of the 7th roots of unity.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_fixed_of_iterate_contraction", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] (f : X → X) (n : ℕ) (K : ℝ) (hK : K < 1) (h : ∀ x y : X, dist (f^[n] x) (f^[n] y) ≤ K * dist x y) (p : X) (hp : f^[n] p = p) : f p = p", "i": "If an iterate f^[n] is a contraction with fixed point p then p is already a fixed point of f — f p is also fixed by f^[n] (iterates commute with f) and a contraction with K < 1 has at most one fixed point.", "o": "conjecture", "c": 0, "r": ""}, {"n": "p3_aux_period", "k": "proved", "d": "数论", "s": "(n k i : ℕ) (h2 : 2 ∣ n) : Nat.fib (i + 2 * n * k) ≡ Nat.fib i [MOD Nat.fib n]", "i": "auxiliary: for even n, 2n is a period of Fibonacci mod F_n", "o": "conjecture", "c": 8, "r": "unsure"}, {"n": "geo_stewart", "k": "proved", "d": "几何与拓扑", "s": "{V : Type*} [NormedAddCommGroup V] [InnerProductSpace ℝ V] (a b c : V) (t : ℝ) : ‖a - ((1 - t) • b + t • c)‖ ^ 2 = (1 - t) * ‖a - b‖ ^ 2 + t * ‖a - c‖ ^ 2 - t * (1 - t) * ‖b - c‖ ^ 2", "i": "Stewart's theorem in vector form: for d = (1−t)b + tc on line bc, |ad|² = (1−t)|ab|² + t|ac|² − t(1−t)|bc|² — write a − d = (1−t)(a−b) + t(a−c) and expand squared norms via inner products.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_lfp_comp_self", "k": "proved", "d": "几何与拓扑", "s": "{α : Type*} [CompleteLattice α] (f : α →o α) : OrderHom.lfp (f.comp f) = OrderHom.lfp f", "i": "The least fixed point of f∘f equals that of f — ≤ since lfp f is fixed by f∘f; for ≥ put a = lfp (f∘f): f a is a fixed point of f∘f so a ≤ f a, hence f a ≤ f (f a) = a, so a is a fixed point of f.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_cos_pi_div_seven_prod", "k": "proved", "d": "几何与拓扑", "s": ": Real.cos (Real.pi / 7) * Real.cos (2 * Real.pi / 7) * Real.cos (4 * Real.pi / 7) = -1 / 8", "i": "cos(π/7)cos(2π/7)cos(4π/7) = −1/8 — multiply by 8 sin(π/7) ≠ 0 and apply sin 2x = 2 sin x cos x three times to get sin(8π/7) = −sin(π/7).", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_centroid_sum_sq_dist", "k": "proved", "d": "几何与拓扑", "s": "{V : Type*} [NormedAddCommGroup V] [InnerProductSpace ℝ V] (a b c : V) : ‖a - (1 / 3 : ℝ) • (a + b + c)‖ ^ 2 + ‖b - (1 / 3 : ℝ) • (a + b + c)‖ ^ 2 + ‖c - (1 / 3 : ℝ) • (a + b + c)‖ ^ 2 = (‖a - b‖ ^ 2 + ‖b - c‖ ^ 2 + ‖c - a‖ ^ 2) / 3", "i": "For the centroid g of triangle abc, |ag|² + |bg|² + |cg|² = (|ab|² + |bc|² + |ca|²)/3 — a − g = ((a−b) + (a−c))/3 etc., expand all squared norms into inner products.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_finite_monotone_iterate_bot_fixed", "k": "proved", "d": "几何与拓扑", "s": "{α : Type*} [PartialOrder α] [OrderBot α] [Finite α] (f : α → α) (hf : Monotone f) : ∃ n : ℕ, f (f^[n] ⊥) = f^[n] ⊥", "i": "On a finite poset with bottom, iterating a monotone map from ⊥ reaches a fixed point — n ↦ f^[n] ⊥ is monotone; if never stationary it would be strictly monotone hence injective ℕ → α, contradicting finiteness.", "o": "conjecture", "c": 0, "r": ""}, {"n": "p3_prop1", "k": "proved", "d": "数论", "s": "(n : ℕ) : p3_fibsum n = Nat.fib (n + 2) - 1", "i": "S_n = F_{n+2} - 1", "o": "paper", "c": 5, "r": "faithful"}, {"n": "geo_euler_quadrilateral", "k": "proved", "d": "几何与拓扑", "s": "{V : Type*} [NormedAddCommGroup V] [InnerProductSpace ℝ V] (a b c d : V) : ‖a - b‖ ^ 2 + ‖b - c‖ ^ 2 + ‖c - d‖ ^ 2 + ‖d - a‖ ^ 2 = ‖a - c‖ ^ 2 + ‖b - d‖ ^ 2 + 4 * ‖(1 / 2 : ℝ) • (a + c) - (1 / 2 : ℝ) • (b + d)‖ ^ 2", "i": "Euler's quadrilateral theorem: the sum of the squared sides equals the sum of the squared diagonals plus four times the squared distance between the midpoints of the diagonals — expand every squared norm into inner products.", "o": "conjecture", "c": 0, "r": ""}, {"n": "p3_remark2", "k": "proved", "d": "数论", "s": "(k : ℕ) : p3_self_summable k ↔ Nat.fib k ∣ Nat.fib (Nat.fib k + 2) - 1", "i": "k is self-summable iff F_k divides F_{F_k+2} - 1", "o": "paper", "c": 1, "r": "faithful"}, {"n": "geo_sum_sq_dist_roots_of_unity", "k": "proved", "d": "几何与拓扑", "s": "(n : ℕ) (hn : 2 ≤ n) (z : ℂ) (hz : ‖z‖ = 1) : ∑ k ∈ Finset.range n, ‖z - Complex.exp (2 * (Real.pi : ℂ) * Complex.I * (k : ℂ) / (n : ℂ))‖ ^ 2 = 2 * (n : ℝ)", "i": "The sum of squared distances from a point of the unit circle to the vertices of the regular n-gon inscribed in it is 2n — ‖z − ζ^k‖² = 2 − 2 Re(z · conj ζ^k), and Σ ζ^k = 0 for the primitive root ζ = exp(2πi/n), n ≥ 2.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_compact_closed_disjoint_dist_pos", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] (K C : Set X) (hK : IsCompact K) (hC : IsClosed C) (hd : Disjoint K C) : ∃ δ : ℝ, 0 < δ ∧ ∀ x ∈ K, ∀ y ∈ C, δ ≤ dist x y", "i": "A compact set and a disjoint closed set in a metric space are a positive distance apart — transfer EMetric.exists_pos_forall_lt_edist to dist, or minimize infDist · C over K.", "o": "conjecture", "c": 0, "r": ""}, {"n": "geo_sum_cos_two_pi_mul_div", "k": "proved", "d": "几何与拓扑", "s": "(n : ℕ) (hn : 2 ≤ n) : ∑ k ∈ Finset.range n, Real.cos (2 * Real.pi * (k : ℝ) / (n : ℝ)) = 0", "i": "The real parts of the n-th roots of unity sum to zero for n ≥ 2 — take the real part of the geometric sum Σ ζ^k = 0 for ζ = exp(2πi/n) (a primitive n-th root, IsPrimitiveRoot.geom_sum_eq_zero).", "o": "conjecture", "c": 0, "r": ""}, {"n": "p3_remark3", "k": "proved", "d": "数论", "s": "(a b : ℕ) (hba : b ≤ a) : (a ≡ b [MOD 4] → (Nat.fib a : ℤ) - Nat.fib b = Nat.fib ((a - b) / 2) * p3_lucas ((a + b) / 2)) ∧ (a ≡ b + 2 [MOD 4] → (Nat.fib a : ℤ) - Nat.fib b = Nat.fib ((a + b) / 2) * p3_lucas ((a - b) / 2))", "i": "F_a - F_b = F_u L_v if a = b mod 4, = F_v L_u if a = b+2 mod 4, where u=(a-b)/2, v=(a+b)/2", "o": "paper", "c": 0, "r": "faithful"}, {"n": "top_connected_metric_sphere_nonempty", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] [PreconnectedSpace X] (x y : X) (r : ℝ) (h0 : 0 ≤ r) (hr : r ≤ dist x y) : ∃ z : X, dist x z = r", "i": "In a connected metric space every radius between 0 and dist x y is attained as a distance from x — intermediate value theorem for the continuous map z ↦ dist x z on a preconnected space, with values 0 at x and dist x y at y.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_edelstein_unique_fixed_point", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] [CompactSpace X] [Nonempty X] (f : X → X) (hf : ∀ x y : X, x ≠ y → dist (f x) (f y) < dist x y) : ∃! p : X, f p = p", "i": "Edelstein: a strictly distance-decreasing self-map of a nonempty compact metric space has exactly one fixed point — f is 1-Lipschitz hence continuous, x ↦ dist x (f x) attains its minimum at some p; if f p ≠ p then dist (f p) (f (f p)) < dist p (f p) contradicts minimality; uniqueness is immediate from strictness.", "o": "conjecture", "c": 3, "r": ""}, {"n": "top_uniformly_discrete_complete", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] (h : ∀ x y : X, x ≠ y → 1 ≤ dist x y) : CompleteSpace X", "i": "A metric space whose distinct points are at distance at least 1 is complete — a Cauchy sequence is eventually within 1/2 of itself hence eventually constant, hence convergent (Metric.complete_of_cauchySeq_tendsto).", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_connected_metric_uncountable", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] [PreconnectedSpace X] (x y : X) (h : x ≠ y) : ¬ (Set.univ : Set X).Countable", "i": "A connected metric space with two distinct points is uncountable — the image of z ↦ dist x z contains the interval [0, dist x y] by the intermediate value theorem, a nondegenerate real interval is uncountable, and images of countable sets are countable.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_tendsto_of_subseq_limits_unique", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] [CompactSpace X] (u : ℕ → X) (a : X) (h : ∀ φ : ℕ → ℕ, StrictMono φ → ∀ b : X, Filter.Tendsto (u ∘ φ) Filter.atTop (nhds b) → b = a) : Filter.Tendsto u Filter.atTop (nhds a)", "i": "In a compact metric space a sequence all of whose convergent subsequences have limit a converges to a — otherwise infinitely many terms stay ε-far from a; extract a subsequence of those, then a convergent sub-subsequence by sequential compactness, whose limit is ≠ a.", "o": "conjecture", "c": 1, "r": ""}, {"n": "top_galois_u_eq_sSup", "k": "proved", "d": "几何与拓扑", "s": "{α β : Type*} [CompleteLattice α] [CompleteLattice β] (l : α → β) (u : β → α) (gc : GaloisConnection l u) (b : β) : u b = sSup {a : α | l a ≤ b}", "i": "The upper adjoint of a Galois connection between complete lattices is given by u b = sSup {a | l a ≤ b} — the set equals Set.Iic (u b) by the adjunction, whose supremum is u b.", "o": "conjecture", "c": 0, "r": ""}, {"n": "top_isometry_compact_surjective", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [MetricSpace X] [CompactSpace X] (f : X → X) (hf : Isometry f) : Function.Surjective f", "i": "An isometry of a compact metric space into itself is surjective — if y is not in the (closed) range, pick ε > 0 with ball y ε disjoint from range f; the orbit f^[n] y then satisfies dist (f^[m] y) (f^[n] y) = dist y (f^[n-m] y) ≥ ε, so it has no convergent subsequence, contradicting sequential compactness.", "o": "conjecture", "c": 2, "r": ""}, {"n": "top_distrib_lattice_median", "k": "proved", "d": "几何与拓扑", "s": "{α : Type*} [DistribLattice α] (a b c : α) : (a ⊓ b) ⊔ (b ⊓ c) ⊔ (c ⊓ a) = (a ⊔ b) ⊓ (b ⊔ c) ⊓ (c ⊔ a)", "i": "The median identity in a distributive lattice — ≤ holds in every lattice (each meet is below each join); for ≥ expand the right side using distributivity and absorb.", "o": "conjecture", "c": 0, "r": ""}, {"n": "p3_thm1_corrected", "k": "proved", "d": "数论", "s": "(p : ℕ) (hp : p.Prime) (h5 : 5 < p) : ((p % 5 = 1 ∨ p % 5 = 4) → (p3_fibsum p : ℤ) ≡ 1 [ZMOD p]) ∧ ((p % 5 = 2 ∨ p % 5 = 3) → (p3_fibsum p : ℤ) ≡ -2 [ZMOD p])", "i": "CORRECTED Theorem 1 (auditor's correction, not the paper's wording): S_p = 1 mod p if p = 1,4 mod 5 and S_p = -2 mod p if p = 2,3 mod 5", "o": "paper", "c": 2, "r": "unsure"}, {"n": "top_countable_compact_t2_isolated_point", "k": "proved", "d": "几何与拓扑", "s": "{X : Type*} [Topological

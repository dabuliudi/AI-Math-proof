name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      lean: ${{ steps.lean.outputs.lean }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Risk tier
        id: tier
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          python3 scripts/risk_tier.py --base "$BASE" | tee tier.txt
          echo "tier=$(head -1 tier.txt)" >> "$GITHUB_OUTPUT"
          { echo '### Risk tier'; echo '```'; cat tier.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Does the change touch the library or the checker
        id: lean
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          if git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD \
              | grep -qE '^(lean/|forge/data/ledger\.jsonl|forge/(verify|leanrun|library|audit)\.py|\.github/workflows/)'; then
            echo lean=true >> "$GITHUB_OUTPUT"
          else
            echo lean=false >> "$GITHUB_OUTPUT"
          fi

  label:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ needs.changes.outputs.tier }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          for t in low medium high; do gh label create "risk:$t" --repo "$REPO" --force >/dev/null; done
          gh pr edit "$PR" --repo "$REPO" --remove-label risk:low,risk:medium,risk:high >/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label "risk:$TIER"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[pdf]'
      - name: forge tests
        run: python -m unittest discover -s forge/tests -t . -v
      - name: tests
        run: python -m unittest discover -s tests -v

  lean:
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib build cache
        working-directory: lean
        run: lake exe cache get
      - name: Build the admission checker
        working-directory: lean
        run: lake build Forge
      - name: Ledger and shards agree
        run: python -m forge consistency
      - name: Build the library and audit every theorem
        run: python -m forge audit
